<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LipeCare Preview</title>
    <style>
      :root {
        color-scheme: light;
        --brand-logo: url("assets/lipecare-logo.png");
        --bg: #fff9f8;
        --bg-soft: #f9ecec;
        --surface: #ffffff;
        --surface-2: #fff7f6;
        --surface-3: #f5e6e8;
        --text: #392332;
        --muted: #796b74;
        --line: rgba(76, 42, 62, 0.10);
        --line-strong: rgba(76, 42, 62, 0.18);
        --primary: #c55777;
        --primary-strong: #ab405f;
        --accent: #155b88;
        --danger: #b63f57;
        --ok: #34755e;
        --shadow: 0 18px 48px rgba(82, 43, 61, 0.09);
        --radius: 14px;
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #1c141a;
        --bg-soft: #261920;
        --surface: #2d2028;
        --surface-2: #36262f;
        --surface-3: #44303a;
        --text: #fff8f6;
        --muted: #cdbdc4;
        --line: rgba(255, 237, 240, 0.09);
        --line-strong: rgba(255, 237, 240, 0.18);
        --primary: #e07a98;
        --primary-strong: #c65a78;
        --accent: #7eb3d4;
        --danger: #ff879b;
        --ok: #86c2aa;
        --shadow: 0 20px 56px rgba(0, 0, 0, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
      }

      .app {
        min-height: 100vh;
      }

      .login {
        align-items: center;
        display: grid;
        gap: 28px;
        grid-template-columns: minmax(0, 1fr) 420px;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--bg-soft);
        padding: 48px clamp(28px, 7vw, 112px);
        position: relative;
      }

      .login::before {
        background: var(--brand-logo) center / contain no-repeat;
        content: "";
        height: 88px;
        left: clamp(28px, 7vw, 112px);
        opacity: 0.9;
        position: absolute;
        top: 42px;
        width: 88px;
      }

      .login-hero h1 {
        color: var(--primary);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 4.4rem;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.02;
        margin: 0 0 22px;
        max-width: 820px;
      }

      .login-hero,
      .login-card {
        min-width: 0;
      }

      .login-hero p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
        margin: 0;
        max-width: 620px;
      }

      .login-card,
      .card,
      .sidebar,
      .mobile-topbar {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .login-card {
        padding: 28px;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 850;
        letter-spacing: 0.08em;
        margin: 0 0 10px;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h2 {
        color: var(--text);
        font-size: 1.22rem;
        letter-spacing: 0;
      }

      .muted {
        color: var(--muted);
      }

      .form {
        display: grid;
        gap: 14px;
      }

      label {
        color: var(--muted);
        display: grid;
        gap: 7px;
        font-size: 0.88rem;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        background: var(--surface-2);
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        color: var(--text);
        min-height: 44px;
        outline: 0;
        padding: 11px 12px;
        width: 100%;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      .patient-picker {
        display: grid;
      }

      .patient-picker input[type="search"] {
        appearance: textfield;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: color-mix(in srgb, var(--primary) 60%, var(--line-strong));
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 14%, transparent);
      }

      .btn {
        align-items: center;
        background: var(--primary);
        border-radius: 10px;
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        font-weight: 850;
        gap: 8px;
        justify-content: center;
        min-height: 42px;
        padding: 0 18px;
        transition: transform 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
        text-decoration: none;
      }

      .btn:hover {
        background: var(--primary-strong);
        box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 22%, transparent);
        transform: translateY(-1px);
      }

      .btn.secondary {
        background: transparent;
        border: 1px solid var(--line-strong);
        color: var(--text);
      }

      .btn.secondary:hover {
        background: var(--surface-2);
        box-shadow: none;
      }

      .btn.ghost {
        background: transparent;
        color: var(--primary);
        padding-inline: 8px;
      }

      .btn.danger {
        background: color-mix(in srgb, var(--danger) 18%, transparent);
        border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
        color: var(--danger);
      }

      .sample-users {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .sample-users button {
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        cursor: pointer;
        padding: 12px;
        text-align: left;
      }

      .sample-users span {
        color: var(--muted);
        display: block;
        font-size: 0.82rem;
        margin-top: 3px;
      }

      .login-links {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        margin-top: 18px;
      }

      .login-links a {
        color: var(--primary);
        font-weight: 800;
        text-decoration: none;
      }

      .auth-feedback {
        border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--line));
        border-radius: 8px;
        color: var(--danger);
        display: none;
        font-size: 0.9rem;
        line-height: 1.45;
        padding: 10px 12px;
      }

      .auth-feedback.visible {
        display: block;
      }

      .slug-preview {
        color: var(--muted);
        font-size: 0.82rem;
        margin-top: -5px;
      }

      .loading-screen {
        align-items: center;
        background: var(--bg);
        color: var(--muted);
        display: grid;
        min-height: 100vh;
        padding: 32px;
        place-items: center;
        text-align: center;
      }

      .shell {
        display: grid;
        grid-template-columns: 276px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        align-self: start;
        border-radius: 0;
        border-width: 0 1px 0 0;
        box-shadow: none;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        gap: 26px;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
        padding: 28px 20px;
        position: sticky;
        top: 0;
      }

      .brand {
        align-items: center;
        display: flex;
        flex: 0 0 auto;
        gap: 12px;
      }

      .logo {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 0;
        display: inline-flex;
        height: 72px;
        justify-content: center;
        overflow: hidden;
        width: 72px;
      }

      .logo img {
        height: 58px;
        object-fit: contain;
        width: 58px;
      }

      .brand strong {
        display: block;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.18rem;
        font-weight: 500;
      }

      .brand span,
      .version {
        color: var(--muted);
        display: block;
        font-size: 0.82rem;
      }

      .version b {
        color: var(--accent);
      }

      .nav,
      .nav-secondary {
        display: grid;
        gap: 6px;
      }

      .sidebar > .nav {
        align-content: start;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }

      .nav button,
      .nav-secondary button {
        align-items: center;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 9px;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        gap: 11px;
        min-height: 44px;
        padding: 0 12px;
        text-align: left;
      }

      .nav button:hover,
      .nav-secondary button:hover {
        background: color-mix(in srgb, var(--primary) 8%, transparent);
        color: var(--text);
      }

      .nav button.active,
      .nav-secondary button.active {
        background: color-mix(in srgb, var(--primary) 10%, var(--surface));
        border-color: color-mix(in srgb, var(--primary) 20%, transparent);
        color: var(--primary);
      }

      .icon {
        align-items: center;
        display: inline-flex;
        height: 20px;
        justify-content: center;
        width: 20px;
      }

      .icon svg {
        height: 18px;
        width: 18px;
      }

      .sidebar-footer {
        border-top: 1px solid var(--line);
        display: grid;
        flex: 0 0 auto;
        gap: 12px;
        margin-top: auto;
        padding-top: 18px;
      }

      .user-mini {
        color: var(--muted);
        line-height: 1.5;
      }

      .user-mini strong {
        color: var(--text);
      }

      .main {
        background: var(--bg);
        padding: 32px;
      }

      .mobile-topbar {
        align-items: center;
        display: none;
        justify-content: space-between;
        margin-bottom: 18px;
        padding: 12px;
      }

      .menu-button {
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }

      .page {
        display: grid;
        gap: 18px;
        margin: 0 auto;
        max-width: 1240px;
      }

      .page-header {
        align-items: end;
        display: flex;
        gap: 18px;
        justify-content: space-between;
      }

      .page-header h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 3rem;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1;
        margin: 0 0 8px;
      }

      .pill {
        align-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        color: var(--primary);
        display: inline-flex;
        font-size: 0.78rem;
        font-weight: 850;
        gap: 8px;
        padding: 8px 12px;
        white-space: nowrap;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .kpis {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .two-col {
        grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.75fr);
      }

      .patients-layout {
        align-items: start;
        grid-template-columns: minmax(320px, 0.8fr) minmax(440px, 1.2fr);
      }

      .patient-list-card table {
        min-width: 560px;
      }

      .patient-record-card {
        min-width: 0;
      }

      .three-col {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .card {
        box-shadow: 0 8px 28px rgba(82, 43, 61, 0.055);
        padding: 20px;
      }

      .stat {
        align-items: center;
        display: flex;
        gap: 14px;
      }

      .stat .stat-icon,
      .module-icon {
        align-items: center;
        background: color-mix(in srgb, var(--primary) 10%, var(--surface-2));
        border: 1px solid color-mix(in srgb, var(--primary) 22%, var(--line));
        border-radius: 10px;
        color: var(--primary);
        display: inline-flex;
        flex: 0 0 auto;
        height: 44px;
        justify-content: center;
        width: 44px;
      }

      .stat strong {
        display: block;
        font-size: 1.8rem;
        line-height: 1;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .hero-panel {
        background: var(--bg-soft);
        border-color: color-mix(in srgb, var(--primary) 18%, var(--line));
        overflow: hidden;
        padding: 26px;
        position: relative;
      }

      .hero-panel::after {
        background: var(--brand-logo) center / contain no-repeat;
        content: "";
        height: 220px;
        opacity: 0.07;
        position: absolute;
        right: 20px;
        top: -30px;
        width: 220px;
      }

      .hero-panel > * {
        position: relative;
        z-index: 1;
      }

      .hero-panel h2 {
        color: var(--primary);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.5rem;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.05;
        max-width: 720px;
      }

      .quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .list-row {
        align-items: center;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr) auto;
        padding: 13px;
      }

      .list-row strong {
        display: block;
      }

      .list-row p {
        color: var(--muted);
        font-size: 0.88rem;
        margin: 3px 0 0;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        border-collapse: collapse;
        min-width: 680px;
        width: 100%;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 13px 10px;
        text-align: left;
      }

      th {
        color: var(--muted);
        font-size: 0.76rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      tr[data-patient] {
        cursor: pointer;
      }

      tr[data-patient]:hover td {
        background: color-mix(in srgb, var(--primary) 7%, transparent);
      }

      .tag {
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        color: var(--muted);
        display: inline-flex;
        font-size: 0.76rem;
        font-weight: 800;
        padding: 6px 9px;
      }

      .tag.ok {
        color: var(--ok);
      }

      .tag.warn {
        color: var(--accent);
      }

      .tag.danger {
        color: var(--danger);
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tabs button {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        cursor: pointer;
        font-weight: 800;
        min-height: 38px;
        padding: 0 14px;
      }

      .tabs button.active {
        border-color: var(--primary);
        color: var(--primary);
      }

      .patient-record-tabs {
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
      }

      .patient-tab-panel {
        display: grid;
        gap: 18px;
        margin-top: 18px;
      }

      .patient-tab-section + .patient-tab-section {
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      .patient-tab-heading {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .patient-tab-heading h3,
      .patient-tab-heading p {
        margin: 0;
      }

      .patient-conversation-preview {
        background: color-mix(in srgb, var(--surface-strong) 82%, transparent);
        border-block: 1px solid var(--line);
        display: grid;
        gap: 10px;
        max-height: 360px;
        overflow-y: auto;
        padding: 16px 4px;
      }

      .patient-conversation-preview .message {
        max-width: min(88%, 560px);
      }

      .timeline {
        display: grid;
        gap: 10px;
      }

      .timeline-item {
        border-left: 2px solid color-mix(in srgb, var(--primary) 45%, transparent);
        padding: 2px 0 14px 16px;
      }

      .timeline-item:last-child {
        padding-bottom: 0;
      }

      .chart-card {
        min-height: 320px;
      }

      .chart-card h2 {
        margin-bottom: 4px;
      }

      .chart-card > .muted {
        font-size: 0.86rem;
        margin-bottom: 18px;
      }

      .chart-svg {
        display: block;
        height: 230px;
        overflow: visible;
        width: 100%;
      }

      .chart-grid-line {
        stroke: var(--line);
        stroke-width: 1;
      }

      .chart-line {
        fill: none;
        stroke: var(--primary);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 3;
      }

      .chart-point {
        fill: var(--surface);
        stroke: var(--primary);
        stroke-width: 3;
      }

      .chart-label,
      .chart-value {
        fill: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 11px;
      }

      .chart-value {
        fill: var(--text);
        font-weight: 800;
      }

      .bar-chart {
        display: grid;
        gap: 16px;
        padding-top: 8px;
      }

      .bar-row {
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) 34px;
      }

      .bar-row span,
      .bar-row strong {
        font-size: 0.84rem;
      }

      .bar-track {
        background: var(--surface-3);
        border-radius: 999px;
        height: 12px;
        overflow: hidden;
      }

      .bar-fill {
        background: var(--primary);
        border-radius: inherit;
        height: 100%;
        min-width: 4px;
      }

      .chat-layout {
        grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.7fr);
      }

      .patient-chat {
        margin: 0 auto;
        max-width: 900px;
        width: 100%;
      }

      .patient-chat .chat-thread {
        height: clamp(340px, calc(100vh - 430px), 560px);
        min-height: 340px;
      }

      .patient-chat-note {
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.5;
        margin: 0;
        text-align: center;
      }

      .chat-thread {
        align-content: start;
        background: var(--bg-soft);
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: clamp(360px, calc(100vh - 390px), 600px);
        max-height: min(66vh, 680px);
        min-height: 360px;
        overflow-y: auto;
        padding: 22px clamp(14px, 3vw, 28px);
        scroll-behavior: auto;
      }

      .chat-window {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        min-width: 0;
        overflow: hidden;
        position: relative;
      }

      .chat-window-bar {
        align-items: center;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        display: flex;
        flex: 0 0 auto;
        justify-content: space-between;
        min-height: 48px;
        padding: 7px 10px 7px 16px;
      }

      .chat-window-bar strong {
        color: var(--text);
        font-size: 0.82rem;
      }

      .chat-window-actions {
        align-items: center;
        display: flex;
        gap: 8px;
      }

      .chat-reset-self-button {
        min-height: 36px;
        padding: 7px 10px;
      }

      .chat-expand-button {
        align-items: center;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        height: 36px;
        justify-content: center;
        transition: background 160ms ease, color 160ms ease;
        width: 36px;
      }

      .chat-expand-button:hover {
        background: var(--surface-3);
        color: var(--primary);
      }

      .chat-expand-button .icon {
        height: 19px;
        margin: 0;
        width: 19px;
      }

      .chat-window.expanded {
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        inset: 12px 12px 12px 288px;
        margin: 0 !important;
        position: fixed;
        z-index: 40;
      }

      .chat-window.expanded .chat-thread {
        flex: 1 1 auto;
        height: auto;
        max-height: none;
        min-height: 0;
      }

      .chat-window.expanded .chat-context-bar,
      .chat-window.expanded .chat-composer,
      .chat-window.expanded .chat-status-banner {
        flex: 0 0 auto;
      }

      .chat-context-bar {
        align-items: center;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 14px 16px;
      }

      .chat-context-bar .form {
        margin: 0;
        max-width: 360px;
        width: 100%;
      }

      .chat-context-tools {
        align-items: end;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }

      .chat-control-panel {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .chat-reset-confirm {
        align-items: center;
        background: var(--surface-2);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        display: flex;
        flex-basis: 100%;
        gap: 12px;
        justify-content: space-between;
        padding: 12px;
      }

      .chat-reset-confirm p {
        margin: 0;
      }

      .chat-window > .chat-reset-confirm {
        margin: 12px 16px 0;
      }

      .ai-switch {
        align-items: center;

      function translateInterfaceText(value, language) {
        const dictionary = INTERFACE_TRANSLATIONS[language];
        if (!dictionary || typeof value !== "string") return value;

        const match = value.match(/^(\s*)(.*?)(\s*)$/s);
        if (!match) return value;
        const [, leading, content, trailing] = match;
        const directTranslation = dictionary[content];
        if (directTranslation) return `${leading}${directTranslation}${trailing}`;

        const patterns = language === "en"
          ? [
              [/^(\d+) ativos$/, "$1 active"],
              [/^(\d+) pacientes$/, "$1 patients"],
              [/^(\d+) registros$/, "$1 records"],
              [/^(\d+) abertas$/, "$1 open"],
              [/^(\d+) tarefas$/, "$1 tasks"],
              [/^(\d+) eventos registrados localmente\.$/, "$1 events recorded locally."],
              [/^(\d+) abertos$/, "$1 open"],
              [/^Agendar com (.+)$/, "Book with $1"],
              [/^Olá, (.+)\. Como você está hoje\?$/, "Hello, $1. How are you today?"],
              [/^Pilar (\d+)$/, "Pillar $1"],
              [/^Indicador (\d+)$/, "Indicator $1"],
              [/^Pergunta (\d+)$/, "Question $1"]
            ]
          : [
              [/^(\d+) ativos$/, "$1 activos"],
              [/^(\d+) pacientes$/, "$1 pacientes"],
              [/^(\d+) registros$/, "$1 registros"],
              [/^(\d+) abertas$/, "$1 abiertas"],
              [/^(\d+) tarefas$/, "$1 tareas"],
              [/^(\d+) eventos registrados localmente\.$/, "$1 eventos registrados localmente."],
              [/^(\d+) abertos$/, "$1 abiertas"],
              [/^Agendar com (.+)$/, "Reservar con $1"],
              [/^Olá, (.+)\. Como você está hoje\?$/, "Hola, $1. ¿Cómo estás hoy?"],
              [/^Pilar (\d+)$/, "Pilar $1"],
              [/^Indicador (\d+)$/, "Indicador $1"],
              [/^Pergunta (\d+)$/, "Pregunta $1"]
            ];

        const pattern = patterns.find(([expression]) => expression.test(content));
        return pattern ? `${leading}${content.replace(pattern[0], pattern[1])}${trailing}` : value;
      }

      function applyInterfaceLanguage(root, language) {
        const activeLanguage = ["en", "es"].includes(language) ? language : "pt";
        document.documentElement.lang = activeLanguage === "pt" ? "pt-BR" : activeLanguage;
        if (activeLanguage === "pt") return;

        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        textNodes.forEach((node) => {
          if (node.parentElement?.closest("script, style, textarea")) return;
          node.nodeValue = translateInterfaceText(node.nodeValue, activeLanguage);
        });

        root.querySelectorAll("[placeholder], [title], [aria-label]").forEach((element) => {
          ["placeholder", "title", "aria-label"].forEach((attribute) => {
            if (!element.hasAttribute(attribute)) return;
            element.setAttribute(attribute, translateInterfaceText(element.getAttribute(attribute), activeLanguage));
          });
        });
      }

      function routeInfo() {
        const parts = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
        if (!parts.length) return { type: "root" };
        if (parts[0] === "cadastro") return { type: "register" };
        if (parts[0] === "login") return { type: "login", slug: parts[1] || null };
        if (parts[0] === "clinica" && parts[1]) { // accent-check: technical-token
          return { type: "clinic", slug: parts[1], view: ROUTE_VIEWS[parts[2]] || "home", legacy: true };
        }
        const directClinicRoute = /^[a-z0-9-]+$/.test(parts[0])
          && parts.length <= 2
          && (!parts[1] || Boolean(ROUTE_VIEWS[parts[1]]));
        if (directClinicRoute) {
          return { type: "clinic", slug: parts[0], view: ROUTE_VIEWS[parts[1]] || "home", legacy: false };
        }
        return { type: "unknown" };
      }

      async function apiRequest(path, options = {}) {
        const headers = { ...(options.headers || {}) };
        if (options.body && typeof options.body !== "string") {
          headers["Content-Type"] = "application/json";
          options.body = JSON.stringify(options.body);
        }
        if (activeSession?.csrfToken && !["GET", "HEAD"].includes(String(options.method || "GET").toUpperCase())) {
          headers["X-LipeCare-CSRF"] = activeSession.csrfToken;
        }
        let response;
        try {
          response = await fetch(`${API_URL}${path}`, { ...options, headers, credentials: "include" });
        } catch {
          const error = new Error("Não foi possível conectar ao servidor. Verifique a API e tente novamente.");
          error.network = true;
          throw error;
        }
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          const message = Array.isArray(payload.message) ? payload.message[0] : payload.message;
          const error = new Error(message || "Não foi possível concluir a solicitação.");
          error.status = response.status;
          throw error;
        }
        return payload;
      }

      const BOOTSTRAP_RETRY_DELAYS = [500, 1200, 2500];

      function shouldRetryBootstrapRequest(error) {
        return error?.network || [502, 503, 504].includes(error?.status);
      }

      async function bootstrapRequest(path, options = {}) {
        let lastError;
        for (let attempt = 0; attempt <= BOOTSTRAP_RETRY_DELAYS.length; attempt += 1) {
          try {
            return await apiRequest(path, options);
          } catch (error) {
            lastError = error;
            if (!shouldRetryBootstrapRequest(error) || attempt === BOOTSTRAP_RETRY_DELAYS.length) throw error;
            await new Promise((resolve) => window.setTimeout(resolve, BOOTSTRAP_RETRY_DELAYS[attempt]));
          }
        }
        throw lastError;
      }

      function syncBootstrapReconnect() {
        window.clearTimeout(bootstrapRetryTimer);
        bootstrapRetryTimer = null;
        if (!bootstrapError || activeSession) return;
        bootstrapRetryTimer = window.setTimeout(bootstrap, 5000);
      }

      function state() {
        const storageKey = stateStorageKey();
        let raw = localStorage.getItem(storageKey);
        if (!raw && activeSession?.tenant?.slug === "raquel-peres") {
          raw = localStorage.getItem("lipecare-redesign-state");
          if (raw) localStorage.setItem(storageKey, raw);
        }
        if (!raw) return initialStateForActiveTenant();
        const stored = JSON.parse(raw);
        const tenantInitial = initialStateForActiveTenant();
        const next = { ...tenantInitial, ...stored };
        next.chats = { ...structuredClone(tenantInitial.chats), ...(stored.chats || {}) };
        next.staffChats = { ...(stored.staffChats || {}) };
        next.staffSimulationVersions = { ...(stored.staffSimulationVersions || {}) };
        next.chatControls = { ...(stored.chatControls || {}) };
        next.workspace = mergeWorkspace(stored.workspace);
        next.workspaceProfiles = { ...(stored.workspaceProfiles || {}) };
        if (!stored.workspaceProfiles) next.workspaceProfiles["u-pro"] = mergeWorkspace(stored.workspace || next.workspace);
        next.conversationProfiles = { ...structuredClone(tenantInitial.conversationProfiles), ...(stored.conversationProfiles || {}) };
        next.checkins = stored.checkins || structuredClone(tenantInitial.checkins);
        if (stored.chat?.length && !stored.chats) next.chats[stored.selectedPatientId || "p-001"] = stored.chat;
        return migrateStoredState(next);
      }

      function legacyClinicalImportState(fallback) {
        if (activeSession?.tenant?.slug !== "raquel-peres") return fallback;
        try {
          const backup = JSON.parse(localStorage.getItem(`lipecare-clinical-import-backup:${activeSession.tenant.id}`) || "null");
          const stored = JSON.parse(localStorage.getItem("lipecare-redesign-state") || "null");
          const candidates = [fallback, backup].filter(Boolean);
          if (stored) {
            const initial = structuredClone(INITIAL_STATE);
            const next = { ...initial, ...stored };
            next.chats = { ...structuredClone(initial.chats), ...(stored.chats || {}) };
            next.staffChats = { ...(stored.staffChats || {}) };
            next.staffSimulationVersions = { ...(stored.staffSimulationVersions || {}) };
            next.chatControls = { ...(stored.chatControls || {}) };
            next.workspace = mergeWorkspace(stored.workspace);
            next.workspaceProfiles = { ...(stored.workspaceProfiles || {}) };
            next.conversationProfiles = { ...structuredClone(initial.conversationProfiles), ...(stored.conversationProfiles || {}) };
            next.checkins = stored.checkins || structuredClone(initial.checkins);
            if (stored.chat?.length && !stored.chats) next.chats[stored.selectedPatientId || "p-001"] = stored.chat;
            candidates.push(migrateStoredState(next));
          }
          return candidates.sort((first, second) => (second.patients?.length || 0) - (first.patients?.length || 0))[0] || fallback;
        } catch (error) {
          console.warn("Não foi possível preparar os dados clínicos locais para importação.", error);
          return fallback;
        }
      }

      function mergeWorkspace(workspace = {}) {

          protocol: {
            ...defaults.protocol,
            ...(workspace.protocol || {}),
            pillars: Array.isArray(workspace.protocol?.pillars) ? workspace.protocol.pillars : defaults.protocol.pillars
          },
          metrics: Array.isArray(workspace.metrics) ? workspace.metrics : defaults.metrics,
          causeQuestions: Array.isArray(workspace.causeQuestions) ? workspace.causeQuestions : defaults.causeQuestions,
          automation: { ...defaults.automation, ...(workspace.automation || {}) }
        };
      }

      function writeLocalState(next) {
        localStorage.setItem(stateStorageKey(), JSON.stringify(next));
      }

      function save(next) {
        ensureClinicalIds(next);
        writeLocalState(next);
        if (clinicalHydrated && activeSession) scheduleClinicalSync();
      }

      function ensureClinicalIds(next) {
        ["symptoms", "measurements", "tasks", "checkins"].forEach((key) => {
          (next[key] || []).forEach((item) => { item.id ||= crypto.randomUUID(); });
        });
        Object.values(next.chats || {}).forEach((messages) => {
          messages.forEach((message) => { message.id ||= crypto.randomUUID(); });
        });
        return next;
      }

      function clinicalSnapshot(next) {
        ensureClinicalIds(next);
        const patientIds = new Set((next.patients || []).map((patient) => patient.id));
        const chats = Object.fromEntries(Object.entries(next.chats || {})
          .filter(([patientId]) => patientIds.has(patientId))
          .map(([patientId, messages]) => [patientId, messages.map((message) => ({
            id: message.id,
            role: ["user", "assistant", "staff"].includes(message.role) ? message.role : "assistant",
            author: message.author || null,
            date: message.date || null,
            text: String(message.text || ""),
            attachments: (message.attachments || []).map((attachment) => ({
              name: String(attachment.name || "Arquivo"),
              type: String(attachment.type || "application/octet-stream"),
              size: Number(attachment.size || 0),
              dataUrl: String(attachment.dataUrl || "")
            })),
            ai: Boolean(message.ai),
            fallback: Boolean(message.fallback),
            welcome: Boolean(message.welcome),
            automatic: Boolean(message.automatic)
          }))]));
        const conversationProfiles = Object.fromEntries(Object.entries(next.conversationProfiles || {})
          .filter(([patientId]) => patientIds.has(patientId)));
        return {
          patients: (next.patients || []).map((patient) => ({
            id: patient.id,
            name: patient.name,
            age: Number.isFinite(Number(patient.age)) ? Number(patient.age) : null,
            phone: patient.phone || "",
            email: patient.email || "",
            city: patient.city || "",
            doctorId: patient.doctorId || null,
            status: patient.status || "Avaliação pendente",
            lastCheckin: patient.lastCheckin || null,
            summary: patient.summary || "",
            interactionFrequency: patient.interactionFrequency || null,
            planningDay: patient.planningDay || null,
            focusMetrics: Array.isArray(patient.focusMetrics) ? patient.focusMetrics : []
          })),
          symptoms: (next.symptoms || []).map((item) => ({ id: item.id, patientId: item.patientId, date: item.date || null, pain: item.pain ?? null, note: item.note || "" })),
          measurements: (next.measurements || []).map((item) => ({
            id: item.id,
            patientId: item.patientId,
            date: item.date || null,
            weight: item.weight ?? null,
            height: item.height ?? null,
            thigh: item.thigh ?? null,
            leg: item.leg ?? null,
            waist: item.waist ?? null,
            hip: item.hip ?? null,
            note: item.note || ""
          })),
          tasks: (next.tasks || []).map((item) => ({ id: item.id, patientId: item.patientId, title: item.title, type: item.type || "Acompanhamento", status: item.status || "Pendente", priority: item.priority || null, due: item.due || null })),
          checkins: (next.checkins || []).map((item) => ({ id: item.id, patientId: item.patientId, date: item.date || null, type: item.type, frequency: item.frequency || null, answers: item.answers || {} })),
          chats,
          conversationProfiles
        };
      }

      function applyClinicalPayload(next, payload) {
        const localPatients = new Map((next.patients || []).map((patient) => [patient.id, patient]));
        next.patients = (payload.patients || []).map((patient) => {
          const local = localPatients.get(patient.id) || {};
          return {
            ...local,
            ...patient,
            planningDay: patient.planningDay || local.planningDay || null,
            focusMetrics: patient.focusMetrics?.length ? patient.focusMetrics : local.focusMetrics || []
          };
        });
        next.symptoms = payload.symptoms || [];
        next.measurements = payload.measurements || [];
        next.tasks = payload.tasks || [];
        next.checkins = payload.checkins || [];
        next.chats = payload.chats || {};
        next.conversationProfiles = payload.conversationProfiles || {};
        next.clinicalSummaries = payload.clinicalSummaries || {};
        next.clinicalAlerts = payload.clinicalAlerts || [];
        if (!next.patients.some((patient) => patient.id === next.selectedPatientId)) {
          next.selectedPatientId = activeSession?.user?.patientId || next.patients[0]?.id || null;
        }
        return ensureClinicalIds(next);
      }

      function mergeClinicalInsights(next, payload) {
        next.clinicalSummaries = payload.clinicalSummaries || {};
        next.clinicalAlerts = payload.clinicalAlerts || [];
        const serverPatients = new Map((payload.patients || []).map((patient) => [patient.id, patient]));
        (next.patients || []).forEach((patient) => {
          const serverPatient = serverPatients.get(patient.id);
          if (serverPatient?.summary) patient.summary = serverPatient.summary;
        });
      }

      async function syncClinicalState() {
        if (!clinicalHydrated || !activeSession) return;
        const next = state();
        const snapshot = JSON.stringify(clinicalSnapshot(next));
        if (snapshot === lastClinicalSnapshot) return;
        const payload = await apiRequest("/clinical/state", { method: "PUT", body: JSON.parse(snapshot) });
        const latest = state();
        mergeClinicalInsights(latest, payload);
        writeLocalState(latest);
        lastClinicalSnapshot = snapshot;
        if (JSON.stringify(clinicalSnapshot(latest)) !== snapshot) scheduleClinicalSync();
      }

      function scheduleClinicalSync() {
        clearTimeout(clinicalSyncTimer);
        clinicalSyncTimer = setTimeout(() => {
          clinicalSyncPromise = clinicalSyncPromise
            .then(syncClinicalState)
            .catch((error) => console.warn("Não foi possível sincronizar os dados clínicos.", error));
        }, 450);
      }

      async function loadClinicalState() {
        clinicalHydrated = false;
        const local = ensureClinicalIds(state());
        writeLocalState(local);
        let payload;
        try {
          payload = await apiRequest("/clinical/state");
        } catch (error) {
          if (error.status !== 404) throw error;
          lastClinicalSnapshot = JSON.stringify(clinicalSnapshot(local));
          return;
        }
        if (!payload.initialized && activeSession?.user?.role !== "ADMIN") {
          const backupKey = `lipecare-clinical-import-backup:${activeSession.tenant.id}`;
          if (!localStorage.getItem(backupKey)) localStorage.setItem(backupKey, JSON.stringify(clinicalSnapshot(local)));
        }
        if (!payload.initialized && activeSession?.user?.role === "ADMIN") {
          const importSource = legacyClinicalImportState(local);
          payload = await apiRequest("/clinical/state", { method: "PUT", body: clinicalSnapshot(importSource) });
        }
        applyClinicalPayload(local, payload);
        writeLocalState(local);
        lastClinicalSnapshot = JSON.stringify(clinicalSnapshot(local));
        clinicalHydrated = true;
      }

      function session() {
        return activeSession?.user || null;
      }

      function setSession(payload) {
        clinicalHydrated = false;
        clearTimeout(clinicalSyncTimer);
        activeSession = { csrfToken: payload.csrfToken, tenant: payload.tenant, user: payload.user };
        const user = activeSession.user;
        if (user.role === "PATIENT") {
          const data = state();
          data.view = "home";
          data.selectedPatientId = user.patientId;
          save(data);
        }
      }

      function welcomeMessage(patient, data = null) {
        const workspace = data ? workspaceConfig(data) : DEFAULT_WORKSPACE;
        const firstName = patient?.name?.split(" ")[0] || "você";
        const assistantName = workspace.assistant.name;
        return `Oi, ${firstName}. ${workspace.assistant.welcomeMessage}\n\nSou ${assistantName}, seu apoio no acompanhamento de ${workspace.identity.professionalName}. Vou conversar com você com base no protocolo definido pela equipe, fazendo uma pergunta por vez.\n\nAntes de começar, você autoriza o armazenamento local e o processamento das mensagens pela IA para este acompanhamento? Pode responder com sim ou não.\n\nEste espaço ajuda a organizar seu cuidado, mas não substitui uma avaliação médica.`;
      }

      function migrateStoredState(data) {
        const canonicalPatients = new Map(INITIAL_STATE.patients.map((patient) => [patient.id, patient]));
        const workspace = workspaceConfig(data);
        data.patients = data.patients.map((patient) => {
          const canonical = canonicalPatients.get(patient.id);
          const migrated = { ...patient };
          if (canonical && normalizePatientSearch(migrated.city) === normalizePatientSearch(canonical.city)) migrated.city = canonical.city;
          if (canonical && normalizePatientSearch(migrated.summary) === normalizePatientSearch(canonical.summary)) {
            migrated.summary = canonical.summary;
          }
          if (normalizePatientSearch(migrated.summary) === normalizePatientSearch("Paciente novo aguardando avaliação inicial.")) {
            migrated.summary = "Paciente novo aguardando avaliação inicial.";
          }
          const normalizedStatus = normalizePatientSearch(migrated.status);
          if (normalizedStatus === normalizePatientSearch("Avaliação pendente")) migrated.status = "Avaliação pendente";
          if (normalizedStatus === "em acompanhamento") migrated.status = "Em acompanhamento";
          if (normalizedStatus === "acompanhamento pausado") migrated.status = "Acompanhamento pausado";
          migrated.interactionFrequency ||= workspace.automation.interactionFrequency;
          migrated.planningDay ||= workspace.automation.planningDay;
          migrated.focusMetrics = Array.isArray(migrated.focusMetrics) ? migrated.focusMetrics : [];
          return migrated;
        });
        const canonicalSymptoms = new Map(INITIAL_STATE.symptoms.map((item) => [item.id, item]));
        data.symptoms = data.symptoms.map((item) => {
          const canonical = canonicalSymptoms.get(item.id);
          if (canonical && normalizePatientSearch(item.note) === normalizePatientSearch(canonical.note)) return { ...item, note: canonical.note };
          return item;
        });
        const canonicalTasks = new Map(INITIAL_STATE.tasks.map((item) => [item.id, item]));
        data.tasks = data.tasks.map((item) => {
          const canonical = canonicalTasks.get(item.id);
          if (!canonical) return item;
          return Object.fromEntries(Object.entries(item).map(([key, value]) => {
            const canonicalValue = canonical[key];
            if (typeof value === "string" && typeof canonicalValue === "string" && normalizePatientSearch(value) === normalizePatientSearch(canonicalValue)) {
              return [key, canonicalValue];
            }
            return [key, value];
          }));
        });
        data.chats = Object.fromEntries(Object.entries(data.chats || {}).map(([patientId, messages]) => {
          const patient = data.patients.find((item) => item.id === patientId);
          if (!patient) return [patientId, messages];
          const migrated = messages.flatMap((message) => {
            const normalized = normalizePatientSearch(message.text);
            if (normalized.includes(normalizePatientSearch("Chat IA em laboratório local"))) {
              return [{ ...message, text: "Olá. Este é o Chat IA em laboratório local. Use esta área para testar acompanhamento, dúvidas sobre lipedema e check-ins sem enviar nada para canais externos." }];
            }
            if (normalized.includes(normalizePatientSearch("Pode me contar quando isso começou")) && normalized.includes(normalizePatientSearch("último acompanhamento"))) {
              return [{ ...message, text: "Obrigada por compartilhar. Pode me contar quando isso começou, o que mudou desde o último acompanhamento e se algo melhora ou piora o que você está sentindo?" }];
            }
            if (message.role !== "assistant") return [message];
            if (normalized.includes(normalizePatientSearch("quando quiser começar")) && normalized.includes(normalizePatientSearch("fazer check-in"))) {
              return [{ ...message, text: `Perfeito. O acompanhamento foi configurado e, a partir de agora, ${workspace.assistant.name} conduzirá as perguntas necessárias no momento certo, uma de cada vez.` }];
            }
            if (message.welcome || normalized.includes(normalizePatientSearch("Que bom ter você aqui"))) {
              return [{ ...message, text: welcomeMessage(patient, data) }];
            }
            if (normalized.includes(normalizePatientSearch("Como você está se sentindo hoje")) && normalized.includes(normalizePatientSearch("qualquer mudança"))) {
              return [];
            }
            return [message];
          });
          return [patientId, migrated];
        }));
        return data;
      }

      function chatProfile(data, patient) {
        if (!patient?.id) return null;
        data.conversationProfiles ||= {};
        const defaults = {
          stage: "consent",
          consent: null,
          frequency: null,
          initialAssessmentCompleted: false,
          lastRoutineDate: null,
          lastMonthlyPeriod: null,
          lastWeeklyPlanDate: null,
          flow: null,
          step: null,
          answers: {},
          engagement: 7,
          lastSituation: "Boas-vindas"
        };
        const profile = { ...defaults, ...(data.conversationProfiles[patient.id] || {}) };
        if (profile.stage === "welcome") profile.stage = "consent";
        data.conversationProfiles[patient.id] = profile;
        return profile;
      }

      function chatControl(data, patient) {
        if (!patient?.id) return { aiEnabled: true, assumedBy: null, assumedByName: null };
        data.chatControls ||= {};
        data.chatControls[patient.id] ||= { aiEnabled: true, assumedBy: null, assumedByName: null };
        return data.chatControls[patient.id];
      }

      function patientMessages(data, patient, startAutomaticFlow = false) {
        if (!patient) return [];
        const profile = chatProfile(data, patient);
        data.chats ||= {};
        data.chats[patient.id] ||= [];
        const messages = data.chats[patient.id];
        let changed = false;
        if (!messages.some((message) => message.welcome)) {
          messages.unshift({ role: "assistant", date: "agora", welcome: true, text: welcomeMessage(patient, data) });
          changed = true;
        }
        if (startAutomaticFlow) {
          const prompt = automaticConversationPrompt(profile, data);
          if (prompt) {
            messages.push({ role: "assistant", date: new Date().toLocaleString("pt-BR"), automatic: true, text: prompt });
            changed = true;
          }
        }
        if (changed) save(data);
        return messages;
      }

      const STAFF_SIMULATION_VERSION = 1;

      function staffSimulationPatient(user) {
        const name = String(user?.name || "")
          .replace(/^Dr(?:a)?\.?\s+/i, "")
          .trim();
        return {
          id: `staff-${user.id}`,
          name: name || "Paciente de teste",
          summary: "Ambiente de simulação do acompanhamento.",
          status: "Avaliação pendente"
        };
      }

      function clearStaffSimulationRecords(data, patientId) {
        data.checkins = (data.checkins || []).filter((item) => item.patientId !== patientId);
        data.symptoms = (data.symptoms || []).filter((item) => item.patientId !== patientId);
        data.measurements = (data.measurements || []).filter((item) => item.patientId !== patientId);
      }

      function staffMessages(data, user, startAutomaticFlow = false) {
        const patient = staffSimulationPatient(user);
        data.staffChats ||= {};
        data.staffSimulationVersions ||= {};
        data.conversationProfiles ||= {};

        if (data.staffSimulationVersions[user.id] !== STAFF_SIMULATION_VERSION) {
          data.staffChats[user.id] = [];
          delete data.conversationProfiles[patient.id];
          clearStaffSimulationRecords(data, patient.id);
          data.staffSimulationVersions[user.id] = STAFF_SIMULATION_VERSION;
        }

        const profile = chatProfile(data, patient);
        const messages = data.staffChats[user.id] || [];
        let changed = false;
        if (!messages.some((message) => message.welcome)) {
          messages.unshift({ role: "assistant", date: "agora", welcome: true, text: welcomeMessage(patient, data) });
          changed = true;
        }
        if (startAutomaticFlow) {
          const prompt = automaticConversationPrompt(profile, data);
          if (prompt) {
            messages.push({ role: "assistant", date: new Date().toLocaleString("pt-BR"), automatic: true, text: prompt });
            changed = true;
          }
        }
        if (changed) save(data);
        return messages;
      }

      function renderAttachment(attachment) {
        const source = String(attachment.dataUrl || "");
        const safeSource = source.startsWith("data:") ? source : "";
        if (attachment.type?.startsWith("image/") && safeSource) return `<img src="${safeSource}" alt="Imagem anexada: ${escapeHtml(attachment.name)}" />`;
        if (attachment.type?.startsWith("audio/") && safeSource) return `<audio controls src="${safeSource}">Seu navegador não oferece suporte à reprodução de áudio.</audio>`;
        return `<div class="attachment-file"><strong>${escapeHtml(attachment.name)}</strong><br />${escapeHtml(attachment.type || "Arquivo")} - ${Math.max(1, Math.round(Number(attachment.size || 0) / 1024))} KB</div>`;
      }

      function chatTime(value) {
        const text = String(value || "agora");
        const match = text.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
        return match ? `${match[1].padStart(2, "0")}:${match[2]}` : text;
      }

      function renderMessage(message, userLabel, assistantLabel, teamLabel = "Equipe") {
        const attachments = (message.attachments || []).map(renderAttachment).join("");
        const authorLabel = message.role === "staff" ? message.author || teamLabel : message.role === "assistant" ? assistantLabel : "";
        const author = authorLabel ? `<span class="message-author">${escapeHtml(authorLabel)}</span>` : "";
        return `<div class="message ${message.role}">${author}${message.text ? `<div class="message-copy">${escapeHtml(message.text)}</div>` : ""}${attachments ? `<div class="message-attachments">${attachments}</div>` : ""}<span class="message-time">${escapeHtml(chatTime(message.date))}</span></div>`;
      }

      function renderPendingMessage(assistantLabel = "Assistente") {
        const status = `${assistantLabel} está preparando a resposta`;
        return `<div class="message assistant pending" role="status" aria-live="polite" aria-label="${escapeHtml(status)}"><span class="message-author">${escapeHtml(assistantLabel)}</span><span class="typing-loader" aria-hidden="true"><span></span><span></span><span></span></span><span class="visually-hidden">${escapeHtml(status)}</span></div>`;
      }

      function loginUsers(data = state()) {
        const customCredentials = data.credentials || [];
        const overriddenPatients = new Set(customCredentials.map((item) => item.patientId));
        return [...USERS.filter((item) => !item.patientId || !overriddenPatients.has(item.patientId)), ...customCredentials];
      }

      function patientCredential(data, patientId) {
        return loginUsers(data).find((item) => item.role === "PATIENT" && item.patientId === patientId);
      }

      function emailInUse(data, email, patientId = null) {
        const normalized = String(email).trim().toLowerCase();
        return loginUsers(data).some((item) => item.email === normalized && item.patientId !== patientId);
      }

      function upsertPatientCredential(data, patient, email, password, syncContactEmail = true) {
        const normalized = String(email).trim().toLowerCase();
        data.credentials = (data.credentials || []).filter((item) => item.patientId !== patient.id);
        const credential = { id: crypto.randomUUID(), name: patient.name, email: normalized, password, role: "PATIENT", patientId: patient.id };
        data.credentials.unshift(credential);
        if (syncContactEmail) patient.email = normalized;
        return credential;
      }

      function syncPatientAccess(patient, email, password) {
        return apiRequest("/tenant/patient-access", {
          method: "PUT",
          body: {
            patientId: patient.id,
            name: patient.name,
            email,
            ...(password ? { password } : {}),
            phone: patient.phone || ""
          }
        });
      }

      async function logout() {
        const slug = activeSession?.tenant?.slug;
        try {
          await apiRequest("/auth/logout", { method: "POST" });
        } catch (error) {
          if (!error.network) console.warn(error);
        }
        clinicalHydrated = false;
        clearTimeout(clinicalSyncTimer);
        activeSession = null;
        activePublicBrand = null;
        navigate(slug ? `/login/${encodeURIComponent(slug)}` : "/login", true);
        await bootstrapRoute();
      }

      function theme() {
        return localStorage.getItem("lipecare-theme") === "light" ? "light" : "dark";
      }

      function setTheme(value) {
        localStorage.setItem("lipecare-theme", value === "light" ? "light" : "dark");
        render();
      }

      function currentWorkspaceOwnerId(data) {
        return activeSession?.tenant?.id || "public";
      }

      function workspaceConfig(data = state()) {
        return mergeWorkspace(data.workspace || DEFAULT_WORKSPACE);
      }

      function saveWorkspaceConfig(data, workspace) {
        data.workspace = mergeWorkspace(workspace);
      }

      async function loadTenantWorkspace() {
        let payload = await apiRequest("/tenant/workspace");
        const importKey = `lipecare-workspace-imported:${payload.tenant.id}`;
        if (payload.tenant.slug === "raquel-peres" && payload.canManage && !localStorage.getItem(importKey)) {
          try {
            const legacy = JSON.parse(localStorage.getItem("lipecare-redesign-state") || "null");
            const legacyWorkspace = legacy?.workspace || legacy?.workspaceProfiles?.["u-pro"];
            if (legacyWorkspace) {
              payload = await apiRequest("/tenant/workspace", {
                method: "PUT",
                body: { version: payload.version, workspace: mergeWorkspace(legacyWorkspace) }
              });
            }
            localStorage.setItem(importKey, new Date().toISOString());
          } catch (error) {
            console.warn("A personalização local ainda não foi importada.", error);
          }
        }
        tenantWorkspaceVersion = payload.version;
        const data = state();
        data.workspace = mergeWorkspace(payload.workspace);
        save(data);
        activeSession.user.canManageWorkspace = payload.canManage;
        return payload;
      }

      async function persistWorkspace(workspace) {
        const payload = await apiRequest("/tenant/workspace", {
          method: "PUT",
          body: { version: tenantWorkspaceVersion, workspace: mergeWorkspace(workspace) }
        });
        tenantWorkspaceVersion = payload.version;
        const data = state();
        data.workspace = mergeWorkspace(payload.workspace);
        save(data);
        return data.workspace;
      }

      function safeLogoSource(value) {
        const source = String(value || "");
        if (source.startsWith("data:image/") || source.startsWith("assets/") || source.startsWith("/assets/") || /^https:\/\//i.test(source)) return source;
        return DEFAULT_WORKSPACE.identity.logo;
      }

      function safeExternalUrl(value) {
        const source = String(value || "").trim();
        return /^https?:\/\//i.test(source) ? source : "";
      }

      function renderPresentationMedia(identity) {
        const source = safeExternalUrl(identity.presentationMedia);
        if (!source) return "";
        if (identity.presentationType === "image") {
          return `<div class="presentation-media"><img src="${escapeHtml(source)}" alt="Apresentação de ${escapeHtml(identity.professionalName)}" /></div>`;
        }
        if (identity.presentationType === "video") {
          return `<a class="btn secondary" href="${escapeHtml(source)}" target="_blank" rel="noreferrer">${icon("play")} Assistir à apresentação</a>`;
        }
        return "";
      }

      function applyWorkspaceTheme(data, selectedWorkspace = null) {
        const workspace = selectedWorkspace || workspaceConfig(data);
        const palette = workspace.palette;
        const dark = theme() === "dark";
        const root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.style.setProperty("--primary", palette.primary);
        root.style.setProperty("--primary-strong", palette.primaryStrong);
        root.style.setProperty("--accent", palette.accent);
        root.style.setProperty("--bg", dark ? palette.darkBackground : palette.lightBackground);
        root.style.setProperty("--surface", dark ? palette.darkSurface : palette.lightSurface);
        root.style.setProperty("--text", dark ? palette.darkText : palette.lightText);
        root.style.setProperty("--muted", dark ? palette.darkMuted : palette.lightMuted);
        root.style.setProperty("--bg-soft", `color-mix(in srgb, ${palette.primary} ${dark ? 7 : 5}%, ${dark ? palette.darkBackground : palette.lightBackground})`);
        root.style.setProperty("--surface-2", `color-mix(in srgb, ${palette.primary} ${dark ? 6 : 3}%, ${dark ? palette.darkSurface : palette.lightSurface})`);
        root.style.setProperty("--surface-3", `color-mix(in srgb, ${palette.primary} ${dark ? 13 : 8}%, ${dark ? palette.darkSurface : palette.lightSurface})`);
        root.style.setProperty("--brand-logo", `url("${safeLogoSource(workspace.identity.logo).replaceAll('"', "%22")}")`);
        document.title = `${workspace.identity.brandName} - Acompanhamento`;
      }

      function roleLabel(role) {
        return { ADMIN: "Administrador", PROFESSIONAL: "Profissional", PATIENT: "Paciente" }[role] || role;
      }

      function today() {
        return new Date().toISOString().slice(0, 10);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function scopedPatients(data, user) {
        if (user.role === "PATIENT") return data.patients.filter((patient) => patient.id === user.patientId);
        if (user.role === "PROFESSIONAL") return data.patients.filter((patient) => patient.doctorId === user.id);
        return data.patients;
      }

      function selectedPatient(data, user) {
        const patients = scopedPatients(data, user);
        return patients.find((patient) => patient.id === data.selectedPatientId) || patients[0];
      }

      function normalizePatientSearch(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim()
          .toLowerCase();
      }

      function patientFromSearch(data, user, value) {
        const query = normalizePatientSearch(value);
        if (!query) return null;
        const patients = scopedPatients(data, user);
        const exact = patients.find((patient) => normalizePatientSearch(patient.name) === query);
        if (exact) return exact;
        const matches = patients.filter((patient) => normalizePatientSearch(patient.name).includes(query));
        return matches.length === 1 ? matches[0] : null;
      }

      function patientFromForm(form, data, user) {
        const input = form.querySelector("[data-patient-search]");
        if (!input) return selectedPatient(data, user);
        const patient = patientFromSearch(data, user, input.value);
        if (!patient) {
          input.setCustomValidity("Selecione um paciente da lista.");
          input.reportValidity();
          return null;
        }
        input.setCustomValidity("");
        const hidden = form.querySelector("[data-patient-id]");
        if (hidden) hidden.value = patient.id;
        return patient;
      }

      function visibleTasks(data, user) {
        const ids = scopedPatients(data, user).map((patient) => patient.id);
        return data.tasks.filter((task) => ids.includes(task.patientId));
      }

      function lineChart(items, valueKey, options = {}) {
        const values = [...items]
          .filter((item) => Number.isFinite(Number(item[valueKey])))
          .sort((a, b) => String(a.date).localeCompare(String(b.date)))
          .slice(-7);
        if (!values.length) return `<div class="empty">Ainda não há dados suficientes para gerar este gráfico.</div>`;

        const width = 640;
        const height = 230;
        const padding = { top: 28, right: 24, bottom: 34, left: 34 };
        const numbers = values.map((item) => Number(item[valueKey]));
        let minimum = options.min ?? Math.min(...numbers) - (options.padding ?? 1);
        let maximum = options.max ?? Math.max(...numbers) + (options.padding ?? 1);
        if (maximum === minimum) maximum = minimum + 1;
        const plotWidth = width - padding.left - padding.right;
        const plotHeight = height - padding.top - padding.bottom;
        const x = (index) => padding.left + (values.length === 1 ? plotWidth / 2 : (index / (values.length - 1)) * plotWidth);
        const y = (value) => padding.top + ((maximum - value) / (maximum - minimum)) * plotHeight;
        const points = values.map((item, index) => `${x(index)},${y(Number(item[valueKey]))}`).join(" ");
        const grid = [0, 1, 2, 3].map((step) => {
          const gridY = padding.top + (step / 3) * plotHeight;
          return `<line class="chart-grid-line" x1="${padding.left}" x2="${width - padding.right}" y1="${gridY}" y2="${gridY}" />`;
        }).join("");
        const markers = values.map((item, index) => {
          const cx = x(index);
          const cy = y(Number(item[valueKey]));
          const label = String(item.date).slice(5).replace("-", "/");
          return `<g><circle class="chart-point" cx="${cx}" cy="${cy}" r="5" /><text class="chart-value" x="${cx}" y="${cy - 12}" text-anchor="middle">${Number(item[valueKey])}${options.suffix || ""}</text><text class="chart-label" x="${cx}" y="${height - 10}" text-anchor="middle">${escapeHtml(label)}</text></g>`;
        }).join("");

        return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(options.label || "Gráfico de evolução")}">${grid}<polyline class="chart-line" points="${points}" />${markers}</svg>`;
      }

      function barChart(entries, label) {
        const maximum = Math.max(1, ...entries.map((entry) => Number(entry.value)));
        return `<div class="bar-chart" role="img" aria-label="${escapeHtml(label)}">${entries.map((entry) => `<div class="bar-row"><span>${escapeHtml(entry.label)}</span><div class="bar-track"><div class="bar-fill" style="width: ${(Number(entry.value) / maximum) * 100}%"></div></div><strong>${Number(entry.value)}</strong></div>`).join("")}</div>`;
      }
