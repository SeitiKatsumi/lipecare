              ${identity.social ? `<p class="muted" style="margin-top: 14px;">Rede social: ${escapeHtml(identity.social)}</p>` : ""}
              ${identity.bookingContact ? `<p class="muted">Contato: ${escapeHtml(identity.bookingContact)}</p>` : ""}
            </article>
            <article class="card">
              <p class="eyebrow">${escapeHtml(workspace.protocol.name)}</p>
              <h2>Seus pilares de cuidado</h2>
              <div class="list">
                ${workspace.protocol.pillars.map((pillar) => `<div class="list-row"><div><strong>${escapeHtml(pillar.name)}</strong><p>${escapeHtml(pillar.description)}</p></div>${safeExternalUrl(pillar.mediaUrl) ? `<a class="btn ghost" href="${escapeHtml(safeExternalUrl(pillar.mediaUrl))}" target="_blank" rel="noreferrer">Abrir</a>` : ""}</div>`).join("") || `<div class="empty">A equipe ainda não publicou pilares de cuidado.</div>`}
              </div>
              ${renderPresentationMedia(identity)}
            </article>
          </section>
        `;
      }

      function renderPatientDashboard(data, user) {
        const patient = selectedPatient(data, user);
        const symptoms = data.symptoms.filter((item) => item.patientId === patient?.id);
        const measurements = data.measurements.filter((item) => item.patientId === patient?.id);
        const weightMeasurements = measurements.filter((item) => item.weight !== null && item.weight !== undefined);
        const tasks = data.tasks.filter((item) => item.patientId === patient?.id);
        const lastSymptom = symptoms[0];
        const lastMeasurement = weightMeasurements[0];
        return `
          ${header("Meu Dashboard", "Uma visão simples da sua evolução e dos próximos cuidados.", patient?.status || "Acompanhamento")}
          <section class="grid kpis">
            ${stat("Dor atual", lastSymptom ? `${lastSymptom.pain}/10` : "-", "symptoms")}
            ${stat("Peso mais recente", lastMeasurement ? `${lastMeasurement.weight} kg` : "-", "measures")}
            ${stat("Check-ins", symptoms.length + measurements.length, "dashboard")}
            ${stat("Pendências", tasks.filter((task) => task.status !== "Resolvido").length, "tasks")}
          </section>
          <section class="grid two-col">
            <article class="card chart-card">
              <h2>Evolução da dor</h2>
              <p class="muted">Intensidade informada nos últimos registros.</p>
              ${lineChart(symptoms, "pain", { min: 0, max: 10, suffix: "/10", label: "Evolução pessoal da intensidade da dor" })}
            </article>
            <article class="card chart-card">
              <h2>Evolução do peso</h2>
              <p class="muted">Variação das medidas corporais registradas.</p>
              ${lineChart(weightMeasurements, "weight", { suffix: " kg", padding: 0.8, label: "Evolução pessoal do peso" })}
            </article>
          </section>
          <section class="grid two-col">
            <article class="card">
              <h2>Minha linha do tempo</h2>
              <div class="timeline">
                ${recentEvents(data, user).slice(0, 6).map((event) => `<div class="timeline-item"><strong>${escapeHtml(event.title)}</strong><p class="muted">${escapeHtml(event.date)} - ${escapeHtml(event.detail)}</p></div>`).join("") || `<div class="empty">Sem atualizações recentes.</div>`}
              </div>
            </article>
            <article class="card">
              <h2>Minhas medidas</h2>
              <div class="list">
                ${measurements.slice(0, 4).map((item) => `<div class="list-row"><div><strong>${escapeHtml(measurementHeadline(item))}</strong><p>${escapeHtml(measurementDetails(item))}</p></div><span class="tag">${escapeHtml(item.date)}</span></div>`).join("") || `<div class="empty">Sem medidas registradas.</div>`}
              </div>
            </article>
          </section>
        `;
      }

      function renderPatientSettings(data, user) {
        const patient = selectedPatient(data, user);
        const credential = patientCredential(data, patient?.id);
        return `
          ${header("Configurações", "Preferências da sua conta e dados de contato.", "Minha conta")}
          <section class="grid settings-grid">
            <article class="card">
              <h2>Preferências</h2>
              <div class="setting-row">
                <div><strong>Aparência</strong><p class="muted">Escolha como deseja visualizar o aplicativo.</p></div>
                <select id="theme-select">
                  <option value="light" ${theme() === "light" ? "selected" : ""}>Claro</option>
                  <option value="dark" ${theme() === "dark" ? "selected" : ""}>Escuro</option>
                </select>
              </div>
              <div class="setting-row">
                <div><strong>Idioma</strong><p class="muted">Idioma usado na sua experiência.</p></div>
                <select id="language-select">
                  <option value="pt" ${data.language === "pt" ? "selected" : ""}>Português</option>
                  <option value="en" ${data.language === "en" ? "selected" : ""}>English</option>
                  <option value="es" ${data.language === "es" ? "selected" : ""}>Español</option>
                </select>
              </div>
            </article>
            <article class="card">
              <h2>Minha conta</h2>
              <form class="form" id="patient-settings-form">
                <label>Nome <input value="${escapeHtml(patient?.name || user.name)}" disabled /></label>
                <label>Telefone <input name="phone" value="${escapeHtml(patient?.phone || "")}" /></label>
                <label>E-mail de contato <input name="email" type="email" value="${escapeHtml(patient?.email || user.email)}" required /></label>
                <label>E-mail de acesso <input value="${escapeHtml(credential?.email || user.email)}" disabled /></label>
                <label>Nova senha <input name="password" type="password" minlength="6" placeholder="Deixe em branco para manter a atual" /></label>
                <button class="btn" type="submit">Salvar minha conta</button>
              </form>
            </article>
          </section>
        `;
      }

      function renderHome(data, user) {
        const workspace = workspaceConfig(data);
        const patients = scopedPatients(data, user);
        const tasks = visibleTasks(data, user);
        const openTasks = tasks.filter((task) => task.status !== "Resolvido");
        const highPain = data.symptoms.filter((item) => patients.some((patient) => patient.id === item.patientId) && item.pain >= 7);
        return `
          <section class="card hero-panel">
            <p class="eyebrow">${escapeHtml(workspace.protocol.name)}</p>
            <h2>Sua clínica, sua identidade e uma jornada contínua para cada paciente.</h2>
            <p class="muted">${escapeHtml(workspace.protocol.foundation)}</p>
            <div class="quick-actions">
              <button class="btn" type="button" data-view="dashboard">Ver dashboard</button>
              <button class="btn secondary" type="button" data-view="patients">Abrir pacientes</button>
              <button class="btn secondary" type="button" data-view="chat">Abrir chat</button>
              <button class="btn secondary" type="button" data-settings-tab="brand">Personalizar marca</button>
            </div>
          </section>
          <section class="grid kpis">
            ${stat("Pacientes ativos", patients.length, "patients")}
            ${stat("Tarefas abertas", openTasks.length, "tasks")}
            ${stat("Dor alta", highPain.length, "alert")}
            ${stat("Check-ins recentes", data.symptoms.length + data.measurements.length, "dashboard")}
          </section>
          <section class="grid two-col">
            <article class="card">
              <h2>Fila assistencial</h2>
              <div class="list">
                ${openTasks.slice(0, 5).map((task) => {
                  const patient = data.patients.find((item) => item.id === task.patientId);
                  return `<div class="list-row"><div><strong>${task.title}</strong><p>${patient?.name || "Paciente"} - ${task.due} - ${task.type}</p></div><span class="tag ${task.priority === "Alta" ? "danger" : "warn"}">${task.priority}</span></div>`;
                }).join("") || `<div class="empty">Nenhuma tarefa aberta.</div>`}
              </div>
            </article>
            <article class="card">
              <h2>Últimos sinais</h2>
              <div class="timeline">
                ${recentEvents(data, user).slice(0, 5).map((event) => `<div class="timeline-item"><strong>${event.title}</strong><p class="muted">${event.date} - ${event.detail}</p></div>`).join("")}
              </div>
            </article>
          </section>
        `;
      }

      function clinicalSummaryStatusLabel(status) {
        return {
          APPROVED: "Aprovado pela equipe",
          NEEDS_REVISION: "Revisão solicitada",
          PENDING_REVIEW: "Aguardando revisão"
        }[status] || "Aguardando geração";
      }

      function clinicalSummaryTag(status) {
        return status === "APPROVED" ? "ok" : status === "NEEDS_REVISION" ? "danger" : "warn";
      }

      function clinicalSeverityLabel(severity) {
        return { LOW: "Baixa", MEDIUM: "Média", HIGH: "Alta", CRITICAL: "Crítica" }[severity] || "Atenção";
      }

      function clinicalAlertTag(severity) {
        return ["HIGH", "CRITICAL"].includes(severity) ? "danger" : severity === "MEDIUM" ? "warn" : "ok";
      }

      function clinicalAlertStatusLabel(status) {
        return { OPEN: "Aberto", ACKNOWLEDGED: "Em análise", RESOLVED: "Resolvido" }[status] || "Aberto";
      }

      function clinicalAlertCountLabel(count) {
        return count === 1 ? "1 alerta" : `${count} alertas`;
      }

      function renderDashboard(data, user) {
        const workspace = workspaceConfig(data);
        const patients = scopedPatients(data, user);
        const tasks = visibleTasks(data, user);
        const symptoms = data.symptoms.filter((item) => patients.some((patient) => patient.id === item.patientId));
        const measurements = data.measurements.filter((item) => patients.some((patient) => patient.id === item.patientId));
        const alerts = (data.clinicalAlerts || []).filter((alert) => patients.some((patient) => patient.id === alert.patientId) && alert.status !== "RESOLVED");
        return `
          ${header("Dashboard", "Indicadores de acompanhamento, risco e rotina clínica.", roleLabel(user.role))}
          <section class="grid kpis">
            ${stat("Pacientes", patients.length, "patients")}
            ${stat("Sintomas", symptoms.length, "symptoms")}
            ${stat("Medidas", measurements.length, "measures")}
            ${stat("Alertas abertos", alerts.length, "alert")}
          </section>
          <section class="grid two-col">
            <article class="card chart-card">
              <h2>Evolução da dor</h2>
              <p class="muted">Registros recentes dos pacientes acompanhados.</p>
              ${lineChart(symptoms, "pain", { min: 0, max: 10, suffix: "/10", label: "Evolução da intensidade da dor dos pacientes" })}
            </article>
            <article class="card chart-card">
              <h2>Atividade de acompanhamento</h2>
              <p class="muted">Volume atual de registros por categoria.</p>
              ${barChart([
                { label: "Sintomas", value: symptoms.length },
                { label: "Medidas", value: measurements.length },
                { label: "Tarefas", value: tasks.length },
                { label: "Pacientes", value: patients.length }
              ], "Volume de acompanhamento por categoria")}
            </article>
          </section>
          <section class="grid two-col">
            <article class="card">
              <h2>Pacientes em acompanhamento</h2>
              ${patientTable(patients)}
            </article>
            <article class="card">
              <h2>Revisão assistencial</h2>
              <div class="list">
                ${alerts.slice(0, 4).map((alert) => {
                  const patient = patients.find((item) => item.id === alert.patientId);
                  return `<div class="list-row"><div><strong>${escapeHtml(alert.title)}</strong><p>${escapeHtml(patient?.name || "Paciente")} - ${escapeHtml(alert.details)}</p></div><span class="tag ${clinicalAlertTag(alert.severity)}">${escapeHtml(clinicalSeverityLabel(alert.severity))}</span></div>`;
                }).join("") || `<div class="empty">Nenhum alerta clínico aberto.</div>`}
              </div>
            </article>
          </section>
        `;
      }

      function renderPatients(data, user) {
        const patients = scopedPatients(data, user);
        const patient = selectedPatient(data, user);
        return `
          ${header("Pacientes", "Cadastro, resumo clínico e histórico de acompanhamento.", `${patients.length} ativos`)}
          <section class="grid patients-layout">
            <article class="card patient-list-card">
              <div class="page-header" style="margin-bottom: 14px;">
                <h2>Lista de pacientes</h2>
                ${user.role !== "PATIENT" ? `<button class="btn" type="button" data-modal="patient">${icon("plus")} Novo</button>` : ""}
              </div>
              ${patientTable(patients)}
            </article>
            <article class="card patient-record-card">
              ${patient ? patientDetail(data, patient) : `<div class="empty">Nenhum paciente disponível.</div>`}
            </article>
          </section>
        `;
      }

      function patientTable(patients) {
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Paciente</th><th>Status</th><th>Último check-in</th><th>Cidade</th></tr></thead>
              <tbody>
                ${patients.map((patient) => `<tr data-patient="${patient.id}"><td><strong>${escapeHtml(patient.name)}</strong><br /><span class="muted">${escapeHtml(patient.phone)}</span></td><td><span class="tag ${patient.status.includes("pendente") ? "warn" : "ok"}">${escapeHtml(patient.status)}</span></td><td>${escapeHtml(patient.lastCheckin)}</td><td>${escapeHtml(patient.city)}</td></tr>`).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function patientDetail(data, patient) {
        const workspace = workspaceConfig(data);
        const symptoms = data.symptoms.filter((item) => item.patientId === patient.id);
        const measures = data.measurements.filter((item) => item.patientId === patient.id);
        const tasks = data.tasks.filter((item) => item.patientId === patient.id);
        const initialAssessment = (data.checkins || []).find((item) => item.patientId === patient.id && item.type === "initial-assessment");
        const credential = patientCredential(data, patient.id);
        const canManageAccess = session()?.role !== "PATIENT";
        const canReviewClinical = session()?.role !== "PATIENT";
        const clinicalSummary = data.clinicalSummaries?.[patient.id] || null;
        const clinicalAlerts = (data.clinicalAlerts || []).filter((alert) => alert.patientId === patient.id);
        const availableTabs = ["summary", "conversation", "symptoms", "measurements", "tasks", "history"];
        const activeTab = availableTabs.includes(data.patientTab) ? data.patientTab : "summary";
        const tabContent = {
          summary: `
            <div class="list">
              <div class="list-row">
                <div style="width: 100%;">
                  <div class="patient-tab-heading"><strong>Resumo clínico</strong><span class="tag ${clinicalSummaryTag(clinicalSummary?.status)}">${escapeHtml(clinicalSummaryStatusLabel(clinicalSummary?.status))}</span></div>
                  ${canReviewClinical ? `<textarea id="clinical-summary-editor" rows="5" aria-label="Resumo clínico para revisão">${escapeHtml(clinicalSummary?.narrative || patient.summary)}</textarea>
                    <div class="inline-actions" style="margin-top: 12px;">
                      <button class="btn" type="button" data-review-summary="APPROVED">Aprovar resumo</button>
                      <button class="btn secondary" type="button" data-review-summary="NEEDS_REVISION">Solicitar revisão</button>
                    </div>` : `<p>${escapeHtml(clinicalSummary?.narrative || patient.summary)}</p>`}
                </div>
              </div>
              <div class="list-row"><div><strong>Alertas clínicos</strong><p>${clinicalAlerts.filter((alert) => alert.status !== "RESOLVED").length === 1 ? "1 alerta exige acompanhamento." : `${clinicalAlerts.filter((alert) => alert.status !== "RESOLVED").length} alertas exigem acompanhamento.`}</p></div><span class="tag ${clinicalAlerts.some((alert) => ["HIGH", "CRITICAL"].includes(alert.severity) && alert.status !== "RESOLVED") ? "danger" : "ok"}">${clinicalAlerts.filter((alert) => alert.status !== "RESOLVED").length === 1 ? "1 aberto" : `${clinicalAlerts.filter((alert) => alert.status !== "RESOLVED").length} abertos`}</span></div>
              ${clinicalAlerts.map((alert) => `<div class="list-row"><div><strong>${escapeHtml(alert.title)}</strong><p>${escapeHtml(alert.details)}</p></div><div class="inline-actions"><span class="tag ${clinicalAlertTag(alert.severity)}">${escapeHtml(clinicalAlertStatusLabel(alert.status))}</span>${canReviewClinical && alert.status !== "RESOLVED" ? `<button class="btn secondary" type="button" data-review-alert="${escapeHtml(alert.id)}" data-alert-status="${alert.status === "OPEN" ? "ACKNOWLEDGED" : "RESOLVED"}">${alert.status === "OPEN" ? "Marcar como visto" : "Resolver"}</button>` : ""}</div></div>`).join("")}
              <div class="list-row"><div><strong>Avaliação inicial</strong><p>${initialAssessment ? escapeHtml(checkinSummary(initialAssessment)) : "Aguardando coleta pelo chat."}</p></div><span class="tag ${initialAssessment ? "ok" : "warn"}">${initialAssessment ? "Concluída" : "Pendente"}</span></div>
              <div class="list-row"><div><strong>Sintomas registrados</strong><p>${symptoms.length} ${symptoms.length === 1 ? "registro" : "registros"}</p></div><span class="tag">${symptoms[0] ? `Dor ${symptoms[0].pain}/10` : "Sem dor"}</span></div>
              <div class="list-row"><div><strong>Medidas registradas</strong><p>${measures.length} ${measures.length === 1 ? "registro" : "registros"}</p></div><span class="tag">${measures[0] ? escapeHtml(measurementHeadline(measures[0])) : "Sem medida"}</span></div>
              <div class="list-row"><div><strong>Tarefas vinculadas</strong><p>${tasks.length} ${tasks.length === 1 ? "tarefa" : "tarefas"}</p></div><span class="tag warn">${tasks.filter((task) => task.status !== "Resolvido").length === 1 ? "1 aberta" : `${tasks.filter((task) => task.status !== "Resolvido").length} abertas`}</span></div>
              <div class="list-row"><div><strong>Cadência ativa</strong><p>Planejamento: ${escapeHtml(patient.planningDay || workspace.automation.planningDay)}</p></div><span class="tag ok">${escapeHtml(patient.interactionFrequency || workspace.automation.interactionFrequency)}</span></div>
              <div class="list-row"><div><strong>Indicadores foco</strong><p>${(patient.focusMetrics || []).map((id) => workspace.metrics.find((metric) => metric.id === id)?.name).filter(Boolean).map(escapeHtml).join(", ") || "Ainda não definidos."}</p></div></div>
              <div class="list-row">
                <div>
                  <strong>Acesso à plataforma</strong>
                  <p>${credential ? `${escapeHtml(credential.email)}${canManageAccess ? ` - senha temporária: ${escapeHtml(credential.password)}` : ""}` : "Esta paciente ainda não possui credenciais."}</p>
                </div>
                ${canManageAccess ? `<button class="btn secondary" type="button" data-modal="access">${credential ? "Editar acesso" : "Criar acesso"}</button>` : credential ? `<span class="tag ok">Ativo</span>` : `<span class="tag warn">Pendente</span>`}
              </div>
            </div>
          `,
          conversation: `
            <section class="patient-tab-section">
              <div class="patient-tab-heading">
                <div><h3>Conversa recente</h3><p class="muted">Acompanhe as últimas mensagens deste prontuário.</p></div>
                <button class="btn secondary" type="button" data-patient-chat="${patient.id}">${icon("chat")} Abrir conversa</button>
              </div>
              <div class="patient-conversation-preview">
                ${patientMessages(data, patient).slice(-4).map((message) => renderMessage(message, patient.name, workspace.assistant.name, `Equipe ${workspace.identity.brandName}`)).join("") || `<div class="empty">Ainda não há mensagens nesta conversa.</div>`}
              </div>
            </section>
          `,
          symptoms: `
            <section class="patient-tab-section">
              <div class="patient-tab-heading"><div><h3>Novo sintoma</h3><p class="muted">Registre dor, inchaço e observações clínicas.</p></div></div>
              <form class="form" id="symptom-form">
                <label>Data <input name="date" type="date" value="${today()}" required /></label>
                <label>Dor de 0 a 10 <input name="pain" type="number" min="0" max="10" value="5" required /></label>
                <label>Observações <textarea name="note" placeholder="Local, gatilho, duração, melhora ou piora..." required></textarea></label>
                <button class="btn" type="submit">Salvar sintoma</button>
              </form>
            </section>
            <section class="patient-tab-section">
              <div class="patient-tab-heading"><h3>Histórico de sintomas</h3><span class="tag">${symptoms.length} registros</span></div>
              <div class="list">
                ${symptoms.map((item) => `<div class="list-row"><div><strong>${escapeHtml(item.date)}</strong><p>${escapeHtml(item.note)}</p></div><span class="tag ${item.pain >= 7 ? "danger" : "warn"}">${item.pain}/10</span></div>`).join("") || `<div class="empty">Sem sintomas registrados.</div>`}
              </div>
            </section>
          `,
          measurements: `
            <section class="patient-tab-section">
              <div class="patient-tab-heading"><div><h3>Nova medida</h3><p class="muted">Registre a evolução corporal da paciente.</p></div></div>
              <form class="form" id="measurement-form">
                <label>Data <input name="date" type="date" value="${today()}" required /></label>
                <label>Peso em kg <input name="weight" type="number" step="0.1" value="72.4" required /></label>
                <label>Cintura em cm <input name="waist" type="number" value="83" required /></label>
                <label>Quadril em cm <input name="hip" type="number" value="104" required /></label>
                <button class="btn" type="submit">Salvar medida</button>
              </form>
            </section>
            <section class="patient-tab-section">
              <div class="patient-tab-heading"><h3>Evolução das medidas</h3><span class="tag">${measures.length} registros</span></div>
              <div class="list">
                ${measures.map((item) => `<div class="list-row"><div><strong>${escapeHtml(item.date)}</strong><p>${escapeHtml(measurementDetails(item))}</p></div><span class="tag">${escapeHtml(measurementHeadline(item))}</span></div>`).join("") || `<div class="empty">Sem medidas registradas.</div>`}
              </div>
            </section>
          `,
          tasks: `
            <section class="patient-tab-section">
              <div class="patient-tab-heading"><div><h3>Nova tarefa</h3><p class="muted">Organize exames, retornos e cuidados deste prontuário.</p></div></div>
              <form class="form" id="task-form">
                <label>Título <input name="title" value="Novo acompanhamento" required /></label>
                <label>Tipo <select name="type"><option>Retorno</option><option>Exame</option><option>Rotina</option></select></label>
                <label>Data <input name="due" type="date" value="${today()}" required /></label>
                <button class="btn" type="submit">Criar tarefa</button>
              </form>
            </section>
            <section class="patient-tab-section">
              <div class="patient-tab-heading"><h3>Tarefas vinculadas</h3><span class="tag warn">${tasks.filter((task) => task.status !== "Resolvido").length} abertas</span></div>
              <div class="list">
                ${tasks.map((task) => `<div class="list-row"><div><strong>${escapeHtml(task.title)}</strong><p>${escapeHtml(task.due)} - ${escapeHtml(task.type)}</p></div><button class="btn secondary" type="button" data-resolve="${task.id}">${escapeHtml(task.status)}</button></div>`).join("") || `<div class="empty">Sem tarefas vinculadas.</div>`}
              </div>
            </section>
          `,
          history: `
            <div class="timeline">
              ${recentEvents(data, { role: "ADMIN" }).filter((event) => event.patientId === patient.id).map((event) => `<div class="timeline-item"><strong>${escapeHtml(event.title)}</strong><p class="muted">${escapeHtml(event.date)} - ${escapeHtml(event.detail)}</p></div>`).join("") || `<div class="empty">Sem histórico.</div>`}
            </div>
          `
        };
        return `
          <div class="page-header" style="align-items: start; margin-bottom: 14px;">
            <div><h2>${escapeHtml(patient.name)}</h2><p class="muted">${patient.age} anos - ${escapeHtml(patient.email)}</p></div>
            ${canManageAccess ? `<button class="btn secondary" type="button" data-modal="edit-patient">Editar dados</button>` : ""}
          </div>
          <div class="tabs patient-record-tabs" aria-label="Áreas do prontuário">
            <button class="${activeTab === "summary" ? "active" : ""}" type="button" data-tab="summary">Resumo</button>
            <button class="${activeTab === "conversation" ? "active" : ""}" type="button" data-tab="conversation">Conversa</button>
            <button class="${activeTab === "symptoms" ? "active" : ""}" type="button" data-tab="symptoms">Sintomas</button>
            <button class="${activeTab === "measurements" ? "active" : ""}" type="button" data-tab="measurements">Medidas</button>
            <button class="${activeTab === "tasks" ? "active" : ""}" type="button" data-tab="tasks">Tarefas</button>
            <button class="${activeTab === "history" ? "active" : ""}" type="button" data-tab="history">Histórico</button>
          </div>
          <div class="patient-tab-panel">${tabContent[activeTab]}</div>
        `;
      }

      function renderChatWindowBar(data, label, actions = "") {
        const expanded = Boolean(data.chatExpanded);
        return `
          <div class="chat-window-bar">
            <strong>${escapeHtml(label)}</strong>
            <div class="chat-window-actions">
              ${actions}
              <button class="chat-expand-button" type="button" data-chat-expand aria-label="${expanded ? "Reduzir chat" : "Ampliar chat"}" title="${expanded ? "Reduzir chat" : "Ampliar chat"}" aria-pressed="${expanded}">
                ${icon(expanded ? "minimize" : "maximize")}
              </button>
            </div>
          </div>
        `;
      }

      function renderChatComposer(patientView = false, teamTakeover = false, pending = false, assistantLabel = "Assistente") {
        const disabled = pending ? "disabled" : "";
        return `
          <form class="chat-composer" id="chat-form" ${pending ? `aria-busy="true"` : ""}>
            <div class="composer-row">
              <label class="composer-icon" aria-label="Anexar imagens ou documentos" title="Anexar imagens ou documentos">
                ${icon("paperclip")}
                <input name="attachment" type="file" accept="image/*,.pdf,.txt,.doc,.docx" multiple ${disabled} />
              </label>
              <textarea name="message" rows="1" placeholder="${pending ? "" : teamTakeover ? "Responder como equipe..." : patientView ? "Conte como você está se sentindo hoje..." : "Digite uma mensagem..."}" ${disabled}></textarea>
              <button class="composer-icon" type="button" data-record-audio aria-label="Gravar áudio" title="Gravar áudio" aria-pressed="false" ${disabled}>${icon("mic")}</button>
              <button class="composer-send" type="submit" aria-label="Enviar mensagem" title="Enviar mensagem" ${disabled}>${icon("send")}</button>
            </div>
            <div class="attachment-selection" aria-live="polite"></div>
            ${patientView ? `<p class="patient-chat-note">Em caso de urgência ou piora importante, procure atendimento médico.</p>` : ""}
          </form>
        `;
      }

      function renderChat(data, user) {
        const workspace = workspaceConfig(data);
        const patient = selectedPatient(data, user);
        const simulationPatient = staffSimulationPatient(user);
        const mode = data.chatMode === "self" ? "self" : "patients";
        const messages = mode === "self" ? staffMessages(data, user, true) : patientMessages(data, patient);
        const pendingKey = mode === "self" ? `staff:${user.id}` : `patient:${patient?.id || ""}`;
        const pending = pendingChats.has(pendingKey);
        const profile = mode === "self" ? chatProfile(data, simulationPatient) : chatProfile(data, patient);
        const control = mode === "patients" ? chatControl(data, patient) : null;
        const assumedByCurrentUser = control?.assumedBy === user.id;
        const assumedByAnotherUser = Boolean(control?.assumedBy && !assumedByCurrentUser);
        const chatStatus = control?.assumedBy
          ? `${control.assumedByName || "A equipe"} assumiu esta conversa.`
          : control?.aiEnabled
            ? `${workspace.assistant.name} está respondendo automaticamente.`
            : "A IA está pausada. Assuma a conversa para responder como equipe.";
        return `
          ${header(mode === "self" ? "Meu chat" : "Chats dos pacientes", mode === "self" ? "Simule aqui a mesma experiência de uma paciente, sem alterar conversas reais." : "Consulte o histórico individual dos pacientes acompanhados.", mode === "self" ? "Ambiente de teste" : `${scopedPatients(data, user).length} pacientes`, "chat-page-header")}
          <div class="tabs">
            <button class="${mode === "patients" ? "active" : ""}" type="button" data-chat-mode="patients">Chats dos pacientes</button>
            <button class="${mode === "self" ? "active" : ""}" type="button" data-chat-mode="self">Meu chat</button>
          </div>
          <section class="${mode === "self" ? "patient-chat" : "grid chat-layout"}">
            <article class="chat-window ${data.chatExpanded ? "expanded" : ""}">
              ${renderChatWindowBar(
                data,
                mode === "self" ? "Simulação da paciente" : `Conversa com ${patient?.name || "paciente"}`,
                mode === "self" && user.role === "ADMIN"
                  ? `<button class="btn secondary chat-reset-self-button" type="button" data-reset-self-chat title="Reiniciar chat">${icon("reset")}<span>Reiniciar chat</span></button>`
                  : ""
              )}
              ${mode === "self" && user.role === "ADMIN" && data.chatResetConfirmUserId === user.id ? `
                <div class="chat-reset-confirm" role="alert">
                  <p><strong>Reiniciar a simulação?</strong><br><span class="muted">O histórico e os registros clínicos de teste serão apagados.</span></p>
                  <div class="inline-actions">
                    <button class="btn danger" type="button" data-confirm-reset-self-chat>Confirmar reinício</button>
                    <button class="btn ghost" type="button" data-cancel-reset-self-chat>Cancelar</button>
                  </div>
                </div>
              ` : ""}
              ${mode === "patients" ? `
                <div class="chat-context-bar">
                  <div><strong>${assumedByCurrentUser ? "Atendimento pela equipe" : "Histórico do paciente"}</strong><p class="muted">${escapeHtml(chatStatus)}</p></div>
                  <div class="chat-context-tools">
                    <form class="form" id="chat-context"><label>Paciente ${patientSelect(data, user)}</label></form>
                    <div class="chat-control-panel">
                      <label class="ai-switch" title="Ativar ou desligar respostas automáticas da IA">
                        <input type="checkbox" data-ai-toggle ${control?.aiEnabled ? "checked" : ""} ${assumedByAnotherUser ? "disabled" : ""} />
                        <span class="switch-track" aria-hidden="true"></span>
                        <span>${control?.aiEnabled ? "IA ativa" : "IA desligada"}</span>
                      </label>
                      <button class="btn ${assumedByCurrentUser ? "" : "secondary"} takeover-button" type="button" data-takeover ${assumedByAnotherUser ? "disabled" : ""}>
                        ${assumedByCurrentUser ? "Devolver à IA" : assumedByAnotherUser ? "Em atendimento" : "Assumir conversa"}
                      </button>
                    </div>
                  </div>
                </div>
              ` : ""}
              <div class="chat-thread">
                ${messages.map((message) => renderMessage(message, mode === "self" ? "Você" : "Paciente", workspace.assistant.name, `Equipe ${workspace.identity.brandName}`)).join("")}
                ${pending ? renderPendingMessage(workspace.assistant.name) : ""}
              </div>
              ${mode === "self" ? renderChatComposer(true, false, pending, workspace.assistant.name) : assumedByCurrentUser ? renderChatComposer(false, true, false, workspace.assistant.name) : ""}
            </article>
            ${mode === "patients" ? `<aside class="card">
                <h2>Resumo do paciente</h2>
                <div class="list">
                  <div class="list-row"><div><strong>${escapeHtml(patient?.name || "Paciente")}</strong><p>${escapeHtml(patient?.summary || "Sem resumo.")}</p></div></div>
                  <div class="list-row"><div><strong>Revisão clínica</strong><p>${escapeHtml(clinicalSummaryStatusLabel(data.clinicalSummaries?.[patient?.id]?.status))}</p></div><span class="tag ${clinicalSummaryTag(data.clinicalSummaries?.[patient?.id]?.status)}">${clinicalAlertCountLabel((data.clinicalAlerts || []).filter((alert) => alert.patientId === patient?.id && alert.status !== "RESOLVED").length)}</span></div>
                  <div class="list-row"><div><strong>Último check-in</strong><p>${escapeHtml(patient?.lastCheckin || "Sem registro")}</p></div></div>
                  <div class="list-row"><div><strong>Situação atual</strong><p>${escapeHtml(profile?.lastSituation || "Boas-vindas")}</p></div><span class="tag">${escapeHtml(profile?.frequency || "A definir")}</span></div>
                  <div class="list-row"><div><strong>Engajamento</strong><p>Leitura local para adaptar acolhimento e próximos passos.</p></div><span class="tag ${Number(profile?.engagement || 0) <= 4 ? "warn" : "ok"}">${Number(profile?.engagement || 0)}/10</span></div>
                  <div class="list-row"><div><strong>Atendimento</strong><p>${escapeHtml(chatStatus)}</p></div><span class="tag ${control?.aiEnabled ? "ok" : "warn"}">${control?.assumedBy ? "Equipe" : control?.aiEnabled ? "IA" : "Pausado"}</span></div>
                  <div class="list-row"><div><strong>Acesso</strong><p>Histórico disponível somente para a equipe responsável.</p></div><span class="tag ok">Leitura</span></div>
                </div>
            </aside>` : ""}
          </section>
        `;
      }

      function renderPatientChat(data, user) {
        const workspace = workspaceConfig(data);
        const patient = selectedPatient(data, user);
        const messages = patientMessages(data, patient, true);
        const pending = pendingChats.has(`patient:${patient?.id || ""}`);
        const control = chatControl(data, patient);
        const patientStatus = control.assumedBy
          ? `${control.assumedByName || "A equipe"} está acompanhando esta conversa.`
          : control.aiEnabled
            ? `${workspace.assistant.name} está disponível para acompanhar você.`
            : "A IA está pausada. A equipe responderá assim que possível.";
        return `
          <section class="patient-chat">
            ${header(`Olá, ${escapeHtml(patient?.name?.split(" ")[0] || user.name.split(" ")[0])}`, `Este é o seu espaço de acompanhamento com a equipe ${escapeHtml(workspace.identity.brandName)}.`, "Privado", "chat-page-header")}
            <article class="chat-window ${data.chatExpanded ? "expanded" : ""}" style="margin-top: 18px;">
              ${renderChatWindowBar(data, "Minha conversa")}
              <div class="chat-status-banner"><span class="status-dot ${control.aiEnabled ? "" : "paused"}"></span>${escapeHtml(patientStatus)}</div>
              <div class="chat-thread">
                ${messages.map((message) => renderMessage(message, "Você", workspace.assistant.name, `Equipe ${workspace.identity.brandName}`)).join("")}
                ${pending ? renderPendingMessage(workspace.assistant.name) : ""}
              </div>
              ${renderChatComposer(true, false, pending, workspace.assistant.name)}
            </article>
          </section>
        `;
      }

      function renderSymptoms(data, user) {
        const patient = selectedPatient(data, user);
        const symptoms = patient ? data.symptoms.filter((item) => item.patientId === patient.id) : [];
        return `
          ${header("Sintomas", "Registro simples de dor, inchaço e observações.", patient?.name || "Paciente")}
          <section class="grid two-col">
            <article class="card">
              <h2>Novo registro</h2>
              <form class="form" id="symptom-form">
                <label>Paciente ${patientSelect(data, user)}</label>
                <label>Data <input name="date" type="date" value="${today()}" required /></label>
                <label>Dor de 0 a 10 <input name="pain" type="number" min="0" max="10" value="5" required /></label>
                <label>Observações <textarea name="note" placeholder="Local, gatilho, duração, melhora ou piora..." required></textarea></label>
                <button class="btn" type="submit">Salvar sintoma</button>
              </form>
            </article>
            <article class="card">
              <h2>Histórico recente</h2>
              <div class="list">
                ${symptoms.map((item) => `<div class="list-row"><div><strong>${item.date}</strong><p>${escapeHtml(item.note)}</p></div><span class="tag ${item.pain >= 7 ? "danger" : "warn"}">${item.pain}/10</span></div>`).join("") || `<div class="empty">Sem sintomas registrados.</div>`}
              </div>
            </article>
          </section>
        `;
      }

      function renderMeasurements(data, user) {
        const patient = selectedPatient(data, user);
        const measurements = patient ? data.measurements.filter((item) => item.patientId === patient.id) : [];
        return `
          ${header("Medidas", "Acompanhamento corporal com leitura clara de tendência.", patient?.name || "Paciente")}
          <section class="grid two-col">
            <article class="card">
              <h2>Novo registro</h2>
              <form class="form" id="measurement-form">
                <label>Paciente ${patientSelect(data, user)}</label>
                <label>Data <input name="date" type="date" value="${today()}" required /></label>
                <label>Peso kg <input name="weight" type="number" step="0.1" value="72.4" required /></label>
                <label>Cintura cm <input name="waist" type="number" value="83" required /></label>
                <label>Quadril cm <input name="hip" type="number" value="104" required /></label>
                <button class="btn" type="submit">Salvar medidas</button>
              </form>
            </article>
            <article class="card">
              <h2>Evolução</h2>
              <div class="list">
                ${measurements.map((item) => `<div class="list-row"><div><strong>${item.date}</strong><p>Cintura ${item.waist} cm - Quadril ${item.hip} cm</p></div><span class="tag">${item.weight} kg</span></div>`).join("") || `<div class="empty">Sem medidas registradas.</div>`}
              </div>
            </article>
          </section>
        `;
      }

      function renderTasks(data, user) {
        const tasks = visibleTasks(data, user);
        return `
          ${header("Tarefas", "Pendências, exames e retornos organizados por paciente.", `${tasks.filter((task) => task.status !== "Resolvido").length} abertas`)}
          <section class="grid two-col">
            <article class="card">
              <h2>Fila de trabalho</h2>
              <div class="list">
                ${tasks.map((task) => {
                  const patient = data.patients.find((item) => item.id === task.patientId);
                  return `<div class="list-row"><div><strong>${task.title}</strong><p>${patient?.name || "Paciente"} - ${task.due} - ${task.type}</p></div><button class="btn secondary" type="button" data-resolve="${task.id}">${task.status}</button></div>`;
                }).join("") || `<div class="empty">Sem tarefas.</div>`}
              </div>
            </article>
            <article class="card">
              <h2>Criar tarefa</h2>
              <form class="form" id="task-form">
                <label>Paciente ${patientSelect(data, user)}</label>
                <label>Título <input name="title" value="Novo acompanhamento" required /></label>
                <label>Tipo <select name="type"><option>Retorno</option><option>Exame</option><option>Rotina</option></select></label>
                <label>Data <input name="due" type="date" value="${today()}" required /></label>
                <button class="btn" type="submit">Criar tarefa</button>
              </form>
            </article>
          </section>
        `;
      }

      function settingsTabs(active) {
        const tabs = [
          ["brand", "Marca"],
          ["protocol", "Protocolo"],
          ["followup", "Acompanhamento"],
          ["system", "Sistema"]
        ];
        return `<nav class="settings-tabs" aria-label="Áreas de configuração">${tabs.map(([id, label]) => `<button class="${active === id ? "active" : ""}" type="button" data-settings-tab="${id}">${label}</button>`).join("")}</nav>`;
      }

      function colorField(name, label, value) {
        return `<label class="color-field"><input name="${name}" type="color" value="${escapeHtml(value)}" /><span>${escapeHtml(label)}<br /><span data-color-value="${name}">${escapeHtml(value)}</span></span></label>`;
      }

      function renderBrandSettings(workspace) {
        const identity = workspace.identity;
        const palette = workspace.palette;
        return `
          <form class="settings-section" id="brand-settings-form">
            <section class="grid settings-grid">
              <article class="card">
                <div class="settings-intro"><div><h2>Identidade da clínica</h2><p class="muted">Nome, atuação e canais exibidos para equipe e pacientes.</p></div><span class="tag ok">Personalizável</span></div>
                <div class="form-grid">
                  <label>Nome da marca <input name="brandName" value="${escapeHtml(identity.brandName)}" required /></label>
                  <label>Nome da clínica <input name="clinicName" value="${escapeHtml(identity.clinicName)}" required /></label>
                  <label>Nome do profissional <input name="professionalName" value="${escapeHtml(identity.professionalName)}" required /></label>
                  <label>Área de atuação <input name="specialty" value="${escapeHtml(identity.specialty)}" required /></label>
                  <label>Site <input name="website" type="url" value="${escapeHtml(identity.website)}" placeholder="https://..." /></label>
                  <label>Rede social <input name="social" value="${escapeHtml(identity.social)}" placeholder="@perfil ou URL" /></label>
                  <label>Link de agendamento <input name="bookingUrl" type="url" value="${escapeHtml(identity.bookingUrl)}" placeholder="https://..." /></label>
                  <label>Contato para agendamento <input name="bookingContact" value="${escapeHtml(identity.bookingContact)}" placeholder="Telefone ou WhatsApp" /></label>
                  <label class="wide">Condição para pacientes do aplicativo <textarea name="patientBenefit" rows="2" placeholder="Informe um benefício, condição diferenciada ou deixe em branco.">${escapeHtml(identity.patientBenefit)}</textarea></label>
                </div>
              </article>
              <article class="card">
                <h2>Logo e assinatura</h2>
                <div class="logo-upload-preview">
                  <img src="${escapeHtml(safeLogoSource(identity.logo))}" alt="Prévia da logo de ${escapeHtml(identity.brandName)}" />
                  <div><strong>Logo atual</strong><p class="muted">Use PNG, JPG ou WebP. A imagem será salva para toda a clínica.</p></div>
                </div>
                <div class="form-grid" style="margin-top: 14px;">
                  <label class="wide">Enviar nova logo <input id="brand-logo-input" type="file" accept="image/png,image/jpeg,image/webp" /></label>
                  <label class="wide">Ou usar uma URL externa <input name="logoUrl" type="url" value="${identity.logo.startsWith("https://") ? escapeHtml(identity.logo) : ""}" placeholder="https://..." /></label>
                </div>
                <button class="btn secondary" type="button" data-reset-logo style="margin-top: 12px;">Restaurar logo padrão</button>
              </article>
            </section>
            <article class="card">
              <div class="settings-intro">
                <div><h2>Paleta da marca</h2><p class="muted">As cores são aplicadas imediatamente em textos, botões, destaques, gráficos e superfícies.</p></div>
                <button class="btn secondary" type="button" data-reset-palette>Restaurar cores padrão</button>
              </div>
              <div class="color-grid">
                ${colorField("primary", "Cor principal", palette.primary)}
                ${colorField("primaryStrong", "Cor principal ativa", palette.primaryStrong)}
                ${colorField("accent", "Cor de apoio", palette.accent)}
                ${colorField("lightBackground", "Fundo claro", palette.lightBackground)}
                ${colorField("lightSurface", "Superfície clara", palette.lightSurface)}
                ${colorField("lightText", "Texto principal claro", palette.lightText)}
                ${colorField("lightMuted", "Texto secundário claro", palette.lightMuted)}
                ${colorField("darkBackground", "Fundo escuro", palette.darkBackground)}
                ${colorField("darkSurface", "Superfície escura", palette.darkSurface)}
                ${colorField("darkText", "Texto principal escuro", palette.darkText)}
                ${colorField("darkMuted", "Texto secundário escuro", palette.darkMuted)}
              </div>
            </article>
            <section class="grid settings-grid">
              <article class="card">
                <h2>Apresentação</h2>
                <div class="form-grid">
                  <label>Formato
                    <select name="presentationType">
                      <option value="text" ${identity.presentationType === "text" ? "selected" : ""}>Texto</option>
                      <option value="image" ${identity.presentationType === "image" ? "selected" : ""}>Imagem</option>
                      <option value="video" ${identity.presentationType === "video" ? "selected" : ""}>Vídeo</option>
                    </select>
                  </label>
                  <label>Link da mídia <input name="presentationMedia" type="url" value="${escapeHtml(identity.presentationMedia)}" placeholder="https://..." /></label>
                  <label class="wide">Título <input name="presentationTitle" value="${escapeHtml(identity.presentationTitle)}" required /></label>
                  <label class="wide">Texto de apresentação <textarea name="presentationText" rows="4" required>${escapeHtml(identity.presentationText)}</textarea></label>
                </div>
              </article>
              <article class="card">
                <h2>Prévia rápida</h2>
                <div class="brand-preview">
                  <img src="${escapeHtml(safeLogoSource(identity.logo))}" alt="" />
                  <div><p class="eyebrow">${escapeHtml(identity.professionalName)}</p><h2>${escapeHtml(identity.brandName)}</h2><p class="muted">${escapeHtml(identity.presentationTitle)}</p></div>
                </div>
                <p class="form-note" style="margin-top: 14px;">A marca também será usada no login, menu, cabeçalhos, área da paciente e contexto do assistente.</p>
              </article>
            </section>
            <div class="inline-actions"><button class="btn" type="submit">Salvar identidade</button></div>
          </form>
        `;
      }

      function renderProtocolSettings(workspace) {
        const protocol = workspace.protocol;
        return `
          <form class="settings-section" id="protocol-settings-form">
            <article class="card">
              <div class="settings-intro"><div><h2>Fundamento profissional</h2><p class="muted">Esta é a fonte principal das orientações dadas pelo acompanhamento.</p></div><span class="tag">Base da IA</span></div>
              <div class="form-grid">
                <label class="wide">Nome do protocolo <input name="protocolName" value="${escapeHtml(protocol.name)}" required /></label>
                <label class="wide">Fundamento da atuação <textarea name="foundation" rows="4" required>${escapeHtml(protocol.foundation)}</textarea></label>
                <label class="wide">O que o protocolo orienta <textarea name="guidance" rows="4" required>${escapeHtml(protocol.guidance)}</textarea></label>
                <label class="wide">O que o protocolo não orienta <textarea name="restrictions" rows="4" required>${escapeHtml(protocol.restrictions)}</textarea></label>
              </div>
            </article>
            <article class="card">
              <h2>Assistente de acompanhamento</h2>
              <div class="form-grid">
                <label>Nome do assistente <input name="assistantName" value="${escapeHtml(workspace.assistant.name)}" required /></label>
                <label class="wide">Mensagem de boas-vindas <textarea name="welcomeMessage" rows="3" required>${escapeHtml(workspace.assistant.welcomeMessage)}</textarea></label>
                <label class="wide">Tom de voz <textarea name="voiceStyle" rows="4" required>${escapeHtml(workspace.assistant.voiceStyle)}</textarea></label>
              </div>
            </article>
            <article class="card">
              <div class="settings-intro"><div><h2>Pilares e materiais</h2><p class="muted">Agrupe orientações e vincule vídeos, imagens ou animações de apoio.</p></div><button class="btn secondary" type="button" data-add-pillar>Adicionar pilar</button></div>
              <div class="config-list">
                ${protocol.pillars.map((pillar, index) => `
                  <div class="config-item">
                    <div class="config-item-header"><strong>Pilar ${index + 1}</strong><button class="btn ghost" type="button" data-remove-pillar="${escapeHtml(pillar.id)}">Remover</button></div>
                    <div class="config-item-grid">
                      <label>Nome <input name="pillar-name-${escapeHtml(pillar.id)}" value="${escapeHtml(pillar.name)}" required /></label>
                      <label class="wide">Material de apoio <input name="pillar-media-${escapeHtml(pillar.id)}" type="url" value="${escapeHtml(pillar.mediaUrl)}" placeholder="https://..." /></label>
                      <label class="wide">Descrição <textarea name="pillar-description-${escapeHtml(pillar.id)}" rows="3" required>${escapeHtml(pillar.description)}</textarea></label>
                    </div>
                  </div>
                `).join("") || `<div class="empty">Adicione o primeiro pilar do protocolo.</div>`}
              </div>
            </article>
            <div class="inline-actions"><button class="btn" type="submit">Salvar protocolo</button></div>
          </form>
        `;
      }

      function renderFollowupSettings(workspace) {
        return `
          <section class="settings-section">
            <article class="card">
              <div class="settings-intro"><div><h2>Sintomas e indicadores</h2><p class="muted">Defina unidades, referências, direção desejada e fórmulas opcionais.</p></div><button class="btn secondary" type="button" data-add-metric>Adicionar indicador</button></div>
              <form class="config-list" id="metrics-settings-form">
                ${workspace.metrics.map((metric, index) => `
                  <div class="config-item">
                    <div class="config-item-header"><strong>Indicador ${index + 1}</strong><button class="btn ghost" type="button" data-remove-metric="${escapeHtml(metric.id)}">Remover</button></div>
                    <div class="config-item-grid">
                      <label>Nome <input name="metric-name-${escapeHtml(metric.id)}" value="${escapeHtml(metric.name)}" required /></label>
                      <label>Unidade <input name="metric-unit-${escapeHtml(metric.id)}" value="${escapeHtml(metric.unit)}" required /></label>
                      <label>Melhor resultado
                        <select name="metric-direction-${escapeHtml(metric.id)}">
                          <option value="down" ${metric.direction === "down" ? "selected" : ""}>Mais baixo</option>

      function renderSystemSettings(data, user) {

            <article class="card">

                  <option value="dark" ${theme() === "dark" ? "selected" : ""}>Escuro</option>
                </select>
              </div>
              <div class="setting-row">
                <div><strong>Idioma</strong><p class="muted">Mantido aqui, sem ocupar uma página inteira.</p></div>
                <select id="language-select">

                  <option value="en" ${data.language === "en" ? "selected" : ""}>English</option>
                  <option value="es" ${data.language === "es" ? "selected" : ""}>Español</option>
                </select>
              </div>
            </article>
            <article class="card">
              <h2>Administração</h2>
              <div class="list">
                <div class="list-row"><div><strong>Dados demo</strong><p>Credenciais e dados continuam fictícios para testes.</p></div><span class="tag ok">Ativo</span></div>
                <div class="list-row"><div><strong>Auditoria</strong><p>${data.audit.length} eventos registrados localmente.</p></div><span class="tag">Local</span></div>
                <div class="list-row"><div><strong>Versão</strong><p>v${BUILD.version}, deploy #${BUILD.deploy}, commit ${BUILD.commit}</p></div></div>
              </div>
              <div class="inline-actions" style="margin-top: 14px;">
                ${user.role === "ADMIN" ? `<button class="btn secondary" type="button" data-view="dashboard">Ver gestão</button>` : ""}
                ${canManage ? `<button class="btn danger" type="button" data-reset-workspace>Restaurar personalização</button>` : ""}
              </div>
            </article>
            ${user.role === "ADMIN" ? `
              <article class="card">
                <h2>Responsáveis pela personalização</h2>
                <p class="muted">Profissionais autorizados podem alterar a marca e o protocolo compartilhados.</p>

      function renderSettings(data, user) {
        const workspace = workspaceConfig(data);
        const activeTab = ["brand", "protocol", "followup", "system"].includes(data.settingsTab) ? data.settingsTab : "brand";
        const sections = {
          brand: renderBrandSettings(workspace),
          protocol: renderProtocolSettings(workspace),
          followup: renderFollowupSettings(workspace),
          system: renderSystemSettings(data, user)
        };
        return `
          ${header("Configurações", "Personalize a marca, o protocolo e a jornada de acompanhamento.", "Sua clínica")}
          ${user.canManageWorkspace ? "" : `<div class="card"><strong>Configuração compartilhada</strong><p class="muted">Você pode consultar a identidade e o protocolo, mas somente administradores e responsáveis autorizados podem alterá-los.</p></div>`}
          ${settingsTabs(activeTab)}
          ${sections[activeTab]}
        `;
      }

      function patientSelect(data, user) {
        const patients = scopedPatients(data, user);
        const patient = selectedPatient(data, user);
        return `
          <div class="patient-picker">
            <input
              type="search"
              name="patientName"
              value="${escapeHtml(patient?.name || "")}"
              list="patient-options"
              placeholder="Digite o nome do paciente"
              autocomplete="off"
              data-patient-search
              required
            />
            <input type="hidden" name="patientId" value="${escapeHtml(patient?.id || "")}" data-patient-id />
            <datalist id="patient-options">
              ${patients.map((item) => `<option value="${escapeHtml(item.name)}"></option>`).join("")}
            </datalist>
          </div>
        `;
      }

      function measurementHeadline(item) {
        return item?.weight !== null && item?.weight !== undefined ? `${item.weight} kg` : "Medidas corporais";
      }

      function measurementDetails(item) {
        const labels = [
          ["Altura", item?.height],
          ["Coxa", item?.thigh],
          ["Perna", item?.leg],
          ["Cintura", item?.waist],
          ["Quadril", item?.hip]
        ];
        const details = labels.filter(([, value]) => value !== null && value !== undefined).map(([label, value]) => `${label} ${value} cm`);
        return details.join(" - ") || "Sem circunferências informadas.";
      }

      function checkinTitle(type) {
        return {
          "initial-assessment": "Avaliação inicial",
          "cause-questionnaire": "Questionário personalizado",
          routine: "Check-in de rotina",
          monthly: "Atualização mensal",
          "weekly-plan": "Planejamento semanal"
        }[type] || "Registro de acompanhamento";
      }

      function checkinSummary(checkin) {
        const answers = checkin?.answers || {};
        if (checkin?.type === "initial-assessment") {
          const scores = [
            ["Bem-estar", answers.wellbeing],
            ["Dor", answers.pain],
            ["Inchaço", answers.swelling],
            ["Sono", answers.sleep],
            ["Energia", answers.energy],
            ["Estresse", answers.stress]
          ].filter(([, value]) => value !== null && value !== undefined).map(([label, value]) => `${label} ${value}/10`);
          const context = [answers.priority ? `Prioridade: ${answers.priority}` : "", answers.commitment ? `Combinado: ${answers.commitment}` : ""].filter(Boolean);
          return [...scores, ...context].join(" - ");
        }
        const recordedAnswers = Object.values(answers).filter((value) => value !== null && value !== undefined && value !== "");
        return `${recordedAnswers.length} respostas registradas.`;
      }

      function recentEvents(data, user) {
        const ids = scopedPatients(data, user).map((patient) => patient.id);
        const messageEvents = Object.entries(data.chats || {}).flatMap(([patientId, messages]) => {
          if (!ids.includes(patientId)) return [];
          return messages.map((message) => ({
            patientId,
            date: message.date,
            title: message.role === "user" ? "Mensagem da paciente" : message.role === "staff" ? "Resposta da equipe" : "Resposta do assistente",
            detail: String(message.text || "Anexo enviado").slice(0, 180)
          }));
        });
        return [
          ...data.symptoms.filter((item) => ids.includes(item.patientId)).map((item) => ({ patientId: item.patientId, date: item.date, title: `Dor ${item.pain}/10`, detail: item.note })),
          ...data.measurements.filter((item) => ids.includes(item.patientId)).map((item) => ({ patientId: item.patientId, date: item.date, title: measurementHeadline(item), detail: measurementDetails(item) })),
          ...(data.checkins || []).filter((item) => ids.includes(item.patientId)).map((item) => ({ patientId: item.patientId, date: item.date, title: checkinTitle(item.type), detail: checkinSummary(item) })),
          ...data.tasks.filter((item) => ids.includes(item.patientId)).map((item) => ({ patientId: item.patientId, date: item.due, title: item.title, detail: item.type })),
          ...(data.clinicalAlerts || []).filter((item) => ids.includes(item.patientId)).map((item) => ({ patientId: item.patientId, date: item.detectedAt, title: item.title, detail: `${clinicalSeverityLabel(item.severity)} - ${clinicalAlertStatusLabel(item.status)}` })),
          ...messageEvents
        ].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      }

      function normalizeChatText(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim()
          .toLowerCase();
      }

      function chatIncludes(value, terms) {
        return terms.some((term) => value.includes(normalizeChatText(term)));
      }

      function chatYesNo(value) {
        if (chatIncludes(value, ["não", "não consegui", "não fiz", "ainda não"])) return false;
        if (chatIncludes(value, ["sim", "consegui", "eu fiz", "realizei", "estou seguindo", "foi bem"])) return true;
        return null;
      }

      function chatScore(text) {
        const match = String(text).match(/(?:^|\D)(10|[0-9])(?:\D|$)/);
        return match ? Number(match[1]) : null;
      }

      function chatNumber(text) {
        const match = String(text).replace(",", ".").match(/(?:^|\D)(\d{1,3}(?:\.\d+)?)(?:\D|$)/);
        return match ? Number(match[1]) : null;
      }

      function chatNumberInRange(text, minimum, maximum) {
        const number = chatNumber(text);
        return number !== null && number >= minimum && number <= maximum ? number : null;
      }

      function chatSkipped(value) {
        return chatIncludes(value, ["não sei", "não tenho", "prefiro não informar", "não quero informar", "pular"]);
      }

      function setConversationSituation(profile, situation) {
        profile.lastSituation = situation;
      }

      function saveConversationRecord(data, patient, profile, type) {
        data.checkins ||= [];
        data.checkins.unshift({
          id: crypto.randomUUID(),
          patientId: patient.id,
          date: new Date().toISOString(),
          type,
          frequency: profile.frequency,
          answers: { ...profile.answers }
        });
        data.checkins = data.checkins.slice(0, 120);
      }

      function daysSince(value) {
        if (!value) return Infinity;
        const current = new Date(`${today()}T00:00:00Z`);
        const previous = new Date(`${value}T00:00:00Z`);
        const difference = current.getTime() - previous.getTime();
        return Number.isFinite(difference) ? Math.floor(difference / 86400000) : Infinity;
      }

      function routineCheckinDue(profile) {
        if (profile.frequency === "Diária") return profile.lastRoutineDate !== today();
        return daysSince(profile.lastRoutineDate) >= 7;
      }

      function weeklyPlanDue(profile) {
        return daysSince(profile.lastWeeklyPlanDate) >= 7;
      }

      function automaticConversationPrompt(profile, data) {
        if (!profile || profile.stage !== "active" || profile.consent !== true || profile.flow) return null;
        if (profile.initialAssessmentCompleted !== true) return startInitialAssessment(profile);
        if (!profile.lastCustomQuestionDate && workspaceConfig(data).causeQuestions.length) return startCustomQuestionnaire(profile, data);
        if (profile.lastMonthlyPeriod !== today().slice(0, 7)) return startMonthlyCheckin(profile);
        if (routineCheckinDue(profile)) return startRoutineCheckin(profile);
        if (weeklyPlanDue(profile)) return startWeeklyPlan(profile);
        return null;
      }

      function startInitialAssessment(profile) {
        profile.flow = "initial";
        profile.step = "wellbeing";
        profile.answers = {};
        setConversationSituation(profile, "Avaliação inicial");
        return "Para conhecer sua situação inicial, vou fazer perguntas curtas sobre sintomas, rotina e hábitos, sempre uma por vez. Você poderá pular medidas que não souber. Para começar: de 0 a 10, como você está se sentindo de forma geral hoje?";
      }

      function initialAssessmentReply(text, value, data, patient, profile) {
        if (profile.step === "wellbeing") {
          const score = chatScore(text);
          if (score === null) return "Pode me dizer um número de 0 a 10 para representar como você está se sentindo hoje?";
          profile.answers.wellbeing = score;
          profile.step = "pain";
          return "Obrigada. De 0 a 10, qual é a intensidade da dor nas pernas hoje?";
        }
        if (profile.step === "pain") {
          const score = chatScore(text);
          if (score === null) return "Qual número de 0 a 10 representa melhor sua dor nas pernas hoje?";
          profile.answers.pain = score;
          profile.step = "swelling";
          return "Entendi. E de 0 a 10, quanto inchaço ou sensação de peso você percebe nas pernas hoje?";
        }
        if (profile.step === "swelling") {
          const score = chatScore(text);
          if (score === null) return "Para acompanhar essa sensação, pode me dizer um número de 0 a 10 para o inchaço ou peso nas pernas?";
          profile.answers.swelling = score;
          profile.step = "sleep";
          return "Obrigada. De 0 a 10, como foi a qualidade do seu sono nos últimos dias?";
        }
        if (profile.step === "sleep") {
          const score = chatScore(text);
          if (score === null) return "Pode representar a qualidade do seu sono com um número de 0 a 10?";
          profile.answers.sleep = score;
          profile.step = "energy";
          return "De 0 a 10, como está sua energia para realizar as atividades do dia a dia?";
        }
        if (profile.step === "energy") {
          const score = chatScore(text);
          if (score === null) return "Pode representar sua energia com um número de 0 a 10?";
          profile.answers.energy = score;
          profile.step = "mood";
          return "Como você descreveria seu humor nos últimos dias?";
        }
        if (profile.step === "mood") {
          profile.answers.mood = text.trim();
          profile.step = "nutrition";
          return "Nos últimos dias, você conseguiu manter o direcionamento de alimentação combinado com a equipe? Pode responder com sim ou não.";
        }
        const answer = chatYesNo(value);
        if (profile.step === "nutrition") {
          if (answer === null) return "Sobre a alimentação, você diria que conseguiu seguir o direcionamento combinado: sim ou não?";
          profile.answers.nutrition = answer;
          if (!answer) {
            profile.step = "nutrition-detail";
            return "Obrigada por contar com sinceridade. O que mais dificultou sua alimentação neste período?";
          }
          profile.step = "strength";
          return "Você conseguiu fazer algum exercício de força que já tenha sido orientado e liberado para você?";
        }
        if (profile.step === "nutrition-detail") {
          profile.answers.nutritionDetail = text;
          profile.step = "strength";
          return "Entendi, sem julgamentos. Você conseguiu fazer algum exercício de força que já tenha sido orientado e liberado para você?";
        }
        if (profile.step === "strength") {
          if (answer === null) return "Sobre o exercício de força, você diria sim ou não?";
          profile.answers.strength = answer;
          if (answer) {
            profile.step = "strength-minutes";
            return "Aproximadamente quantos minutos de exercício de força você fez nos últimos sete dias? Se não souber, pode pular.";
          }
          profile.step = "aerobic";
          return "E conseguiu fazer algum exercício aeróbico ou movimento leve já liberado para você?";
        }
        if (profile.step === "strength-minutes") {
          const minutes = chatNumberInRange(text, 0, 1000);
          if (minutes === null && !chatSkipped(value)) return "Pode informar uma estimativa em minutos ou dizer que prefere pular?";
          profile.answers.strengthMinutes = chatSkipped(value) ? null : minutes;
          profile.step = "aerobic";
          return "E conseguiu fazer algum exercício aeróbico ou movimento leve já liberado para você?";
        }
        if (profile.step === "aerobic") {
          if (answer === null) return "Sobre o exercício aeróbico ou movimento leve, você diria sim ou não?";
          profile.answers.aerobic = answer;
          if (answer) {
            profile.step = "aerobic-minutes";
            return "Aproximadamente quantos minutos de atividade aeróbica ou movimento leve você fez nos últimos sete dias? Se não souber, pode pular.";
          }
          profile.step = "social";
          return "Você teve algum momento de descontração com amigos ou família nos últimos dias?";
        }
        if (profile.step === "aerobic-minutes") {
          const minutes = chatNumberInRange(text, 0, 1000);
          if (minutes === null && !chatSkipped(value)) return "Pode informar uma estimativa em minutos ou dizer que prefere pular?";
          profile.answers.aerobicMinutes = chatSkipped(value) ? null : minutes;
          profile.step = "social";
          return "Você teve algum momento de descontração com amigos ou família nos últimos dias?";
        }
        if (profile.step === "social") {
          if (answer === null) return "Sobre o momento com amigos ou família, você diria sim ou não?";
          profile.answers.social = answer;
          profile.step = "development";
          return "Houve algum momento dedicado a você, como um livro, curso, filme, evento ou outro interesse pessoal?";
        }
        if (profile.step === "development") {
          if (answer === null) return "Sobre esse tempo dedicado a você, você diria sim ou não?";
          profile.answers.development = answer;
          profile.step = "alcohol";
          return "Nos últimos sete dias, em quantos dias você consumiu bebida alcoólica? Responda de 0 a 7.";
        }
        if (profile.step === "alcohol") {
          const days = chatNumberInRange(text, 0, 7);
          if (days === null) return "Pode me dizer um número de 0 a 7 para os dias em que consumiu bebida alcoólica?";
          profile.answers.alcoholDays = days;
          profile.step = "stress";
          return "De 0 a 10, quanto o estresse interferiu no seu bem-estar nos últimos dias?";
        }
        if (profile.step === "stress") {
          const score = chatScore(text);
          if (score === null) return "Pode representar o impacto do estresse com um número de 0 a 10?";
          profile.answers.stress = score;
          profile.step = "medications";
          return "Você usa algum medicamento ou suplemento que a equipe deva considerar? Se não usar, pode responder não.";
        }
        if (profile.step === "medications") {
          profile.answers.medications = chatYesNo(value) === false ? "Não informado" : text.trim();
          profile.step = "exams";
          return "Há algum exame recente ou observação clínica que você gostaria de registrar para conversar com a equipe? Se não houver, pode responder não.";
        }
        if (profile.step === "exams") {
          profile.answers.exams = chatYesNo(value) === false ? "Não informado" : text.trim();
          profile.step = "weight";
          return "Agora vamos às medidas opcionais. Qual é o seu peso atual em quilogramas? Se não souber ou preferir não informar, pode pular.";
        }
        if (profile.step === "weight") {
          const weight = chatNumberInRange(text, 20, 400);
          if (weight === null && !chatSkipped(value)) return "Pode informar o peso em quilogramas, por exemplo 72,5, ou dizer que prefere pular.";
          profile.answers.weight = chatSkipped(value) ? null : weight;
          profile.step = "height";
          return "Qual é a sua altura em centímetros? Se não souber ou preferir não informar, pode pular.";
        }
        if (profile.step === "height") {
          const height = chatNumberInRange(text, 100, 230);
          if (height === null && !chatSkipped(value)) return "Pode informar a altura em centímetros, por exemplo 165, ou dizer que prefere pular.";
          profile.answers.height = chatSkipped(value) ? null : height;
          profile.step = "measurements-consent";
          return "Você tem medidas atuais de coxa, perna, cintura e quadril e gostaria de registrá-las agora? Pode responder com sim ou não.";
        }

      function customQuestionReply(text, value, data, patient, profile) {
        const questions = workspaceConfig(data).causeQuestions;
        const index = Number(profile.step || 0);
        const question = questions[index];
        if (!question) {
          profile.flow = null;
          profile.step = null;
          return "O questionário foi atualizado pela equipe. Vamos continuar o acompanhamento a partir da próxima conversa.";
        }

        let answer = text.trim();
        if (question.answerType === "boolean") {
          const booleanAnswer = chatYesNo(value);
          if (booleanAnswer === null) return "Para eu registrar corretamente, você pode responder com sim ou não?";
          answer = booleanAnswer;
        }
        if (question.answerType === "scale") {
          const score = chatScore(text);
          if (score === null) return "Pode responder com um número de 0 a 10?";
          answer = score;
        }
        if (question.answerType === "number") {
          const match = String(text).replace(",", ".").match(/-?\d+(?:\.\d+)?/);
          if (!match) return "Pode responder usando um número?";
          answer = Number(match[0]);
        }

        profile.answers[question.id] = answer;
        const nextIndex = index + 1;
        if (nextIndex < questions.length) {
          profile.step = String(nextIndex);
          return customQuestionPrompt(questions[nextIndex], nextIndex, questions.length);
        }

        saveConversationRecord(data, patient, profile, "cause-questionnaire");
        profile.flow = null;
        profile.step = null;
        profile.lastCustomQuestionDate = today();
        patient.lastCheckin = today();
        setConversationSituation(profile, "Questionário personalizado concluído");
