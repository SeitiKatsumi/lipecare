      function readAttachment(file) {
        if (!file || !file.size) return Promise.resolve(null);
        if (file.size > 2.5 * 1024 * 1024) return Promise.reject(new Error(`O arquivo ${file.name} ultrapassa o limite de 2,5 MB.`));
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener("load", () => resolve({ name: file.name, type: file.type || "application/octet-stream", size: file.size, dataUrl: String(reader.result) }));
          reader.addEventListener("error", () => reject(new Error(`Não foi possível ler o arquivo ${file.name}.`)));
          reader.readAsDataURL(file);
        });
      }

      function recordingDuration(seconds) {
        const minutes = Math.floor(seconds / 60);
        return `${String(minutes).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function updateComposerAttachmentStatus(form) {
        const status = form?.querySelector(".attachment-selection");
        if (!status) return;
        const files = [...form.querySelectorAll("input[type='file']")].flatMap((field) => [...field.files]);
        const parts = [];
        if (files.length) parts.push(`${files.length} ${files.length === 1 ? "arquivo selecionado" : "arquivos selecionados"}: ${files.map((file) => file.name).join(", ")}`);
        if (form.recordedAudioFile) parts.push(`Áudio gravado: ${form.recordedAudioFile.name}`);
        status.textContent = parts.join(" | ");
      }

      function stopActiveAudioRecording(discard = false) {
        const session = activeAudioSession;
        if (!session) return;
        session.discarded ||= discard;
        if (session.recorder.state === "recording") session.recorder.stop();
      }

      async function toggleAudioRecording(button) {
        const form = button.closest("form");
        if (!form) return;
        if (activeAudioSession?.form === form && activeAudioSession.recorder.state === "recording") {
          stopActiveAudioRecording();
          return;
        }
        if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") {
          alert("A gravação de áudio não está disponível neste navegador.");
          return;
        }
        if (activeAudioSession) stopActiveAudioRecording(true);

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch {
          alert("Não foi possível acessar o microfone. Verifique a permissão do navegador.");
          return;
        }

        const supportedTypes = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
        const mimeType = supportedTypes.find((type) => MediaRecorder.isTypeSupported(type));
        const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        const session = {
          button,
          chunks: [],
          discarded: false,
          form,
          recorder,
          startedAt: Date.now(),
          stream,
          timer: null,
          timeout: null
        };
        activeAudioSession = session;
        form.recordedAudioFile = null;
        button.classList.add("recording");
        button.setAttribute("aria-label", "Parar gravação");
        button.setAttribute("title", "Parar gravação");
        button.setAttribute("aria-pressed", "true");
        form.querySelector(".composer-send").disabled = true;
        const status = form.querySelector(".attachment-selection");
        status.textContent = "Gravando áudio... 00:00";

        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size) session.chunks.push(event.data);
        });
        recorder.addEventListener("stop", () => {
          clearInterval(session.timer);
          clearTimeout(session.timeout);
          session.stream.getTracks().forEach((track) => track.stop());
          button.classList.remove("recording");
          button.setAttribute("aria-label", "Gravar áudio");
          button.setAttribute("title", "Gravar áudio");
          button.setAttribute("aria-pressed", "false");
          form.querySelector(".composer-send").disabled = false;
          if (!session.discarded && session.chunks.length) {
            const type = recorder.mimeType || mimeType || "audio/webm";
            const extension = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
            const blob = new Blob(session.chunks, { type });
            const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
            form.recordedAudioFile = new File([blob], `gravacao-${timestamp}.${extension}`, { type });
          }
          if (activeAudioSession === session) activeAudioSession = null;
          updateComposerAttachmentStatus(form);
        });

        recorder.start(250);
        session.timer = setInterval(() => {
          const elapsed = Math.floor((Date.now() - session.startedAt) / 1000);
          status.textContent = `Gravando áudio... ${recordingDuration(elapsed)}. Toque novamente para parar.`;
        }, 500);
        session.timeout = setTimeout(() => stopActiveAudioRecording(), 120000);
      }

      function attachmentReply(attachments, patient) {
        const firstName = patient?.name?.split(" ")[0] || "você";
        const hasImage = attachments.some((item) => item.type.startsWith("image/"));
        const hasAudio = attachments.some((item) => item.type.startsWith("audio/"));
        const hasDocument = attachments.some((item) => !item.type.startsWith("image/") && !item.type.startsWith("audio/"));
        const received = [hasImage ? "imagem" : "", hasAudio ? "áudio" : "", hasDocument ? "documento" : ""].filter(Boolean).join(", ");
        if (hasImage) return `Recebi o anexo, ${firstName}. A imagem ficou disponível nesta conversa para análise e acompanhamento. Conte qual região, mudança ou detalhe você gostaria de observar. Imagens ajudam no registro, mas não substituem uma avaliação médica.`;
        if (hasAudio) return `Recebi seu áudio, ${firstName}. Ele ficou anexado à conversa. Se puder, escreva também em uma frase o ponto principal para que o acompanhamento fique mais fácil de consultar depois.`;
        return `Recebi o ${received || "arquivo"}, ${firstName}. O anexo ficou registrado nesta conversa. Diga quais informações você gostaria de organizar ou discutir com a equipe.`;
      }

      function chatReply(text, patient, data, attachments = []) {
        const value = normalizeChatText(text);
        const profile = chatProfile(data, patient);
        const workspace = workspaceConfig(data);
        const firstName = patient?.name?.split(" ")[0] || "você";

        if (attachments.length) {
          setConversationSituation(profile, "Anexo recebido");
          return attachmentReply(attachments, patient);
        }

        if (chatIncludes(value, ["falta de ar", "dor no peito", "desmaio", "sangramento intenso", "dor insuportável", "piora muito rápida"])) {
          setConversationSituation(profile, "Sinal de alerta");
          return "Sinto muito que você esteja passando por isso. Esse relato merece avaliação imediata e não deve ser conduzido apenas pelo chat. Procure um serviço de urgência ou atendimento médico agora. Se estiver sozinha, peça apoio a alguém de confiança.";
        }

        if (chatIncludes(value, ["diagnóstico", "qual remédio", "medicamento devo", "posologia", "qual dose", "receita", "interpretar exame", "resultado do exame", "preciso operar", "devo fazer cirurgia"])) {
          setConversationSituation(profile, "Orientação clínica");
          return `Entendo por que você busca uma resposta clara. Diagnósticos, interpretação de exames, prescrição, doses e indicação cirúrgica precisam ser avaliados individualmente por um médico. Posso ajudar você a organizar sintomas, dúvidas e mudanças recentes para conversar com ${workspace.identity.professionalName} ou com outro profissional de confiança.`;
        }

        if (chatIncludes(value, ["iniciar primeiro contato", "reiniciar primeiro contato", "boas-vindas", "boas vindas"])) {
          Object.assign(profile, {
            stage: "consent",
            consent: null,
            frequency: null,
            initialAssessmentCompleted: false,
            lastRoutineDate: null,
            lastMonthlyPeriod: null,
            lastWeeklyPlanDate: null,
            flow: null,
            step: null,
            answers: {},
            engagement: 7
          });
          setConversationSituation(profile, "Boas-vindas");
          return welcomeMessage(patient, data);
        }

        if (profile.flow && chatIncludes(value, ["cancelar", "parar questionário"])) {
          profile.flow = null;
          profile.step = null;
          profile.answers = {};
          setConversationSituation(profile, "Conversa livre");
          return "Tudo bem, paramos por aqui. Você pode retomar quando se sentir pronta. Cuidar também é respeitar o próprio ritmo.";
        }

        if (profile.stage === "welcome") {
          profile.stage = "consent";
          setConversationSituation(profile, "Consentimento");
          return welcomeMessage(patient, data);
        }

        if (profile.stage === "consent") {
          const consent = chatYesNo(value);
          if (consent === null) return "Para eu registrar corretamente: você autoriza o armazenamento local e o processamento das mensagens pela IA neste acompanhamento? Pode responder com sim ou não.";
          profile.consent = consent;
          if (!consent) {
            profile.stage = "consent-declined";
            setConversationSituation(profile, "Consentimento não concedido");
            return "Tudo bem. Sua escolha será respeitada e não iniciarei a coleta de acompanhamento. Ainda posso oferecer informações gerais sobre autocuidado e ajudar você a preparar dúvidas para uma consulta.";
          }
          profile.stage = "frequency";
          setConversationSituation(profile, "Definição de frequência");
          return "Obrigada pela confiança. Algumas pessoas preferem anotar suas sensações todos os dias; outras se sentem melhor com um resumo semanal. Você prefere acompanhamento diário ou semanal?";
        }

        if (profile.stage === "frequency") {
          const frequency = value.includes("diari") ? "Diária" : value.includes("seman") ? "Semanal" : null;
          if (!frequency) return "Qual ritmo combina melhor com você neste momento: diário ou semanal?";
          profile.frequency = frequency;
          profile.stage = "active";
          const firstQuestion = startInitialAssessment(profile);
          return `Perfeito. O acompanhamento ficou definido como ${frequency.toLowerCase()}. Podemos ajustar esse ritmo depois, se necessário.\n\n${firstQuestion}`;
        }

        if (profile.stage === "consent-declined" && chatIncludes(value, ["autorizo", "quero autorizar", "mudei de ideia"])) {
          profile.consent = true;
          profile.stage = "frequency";
          setConversationSituation(profile, "Definição de frequência");
          return "Obrigada por me avisar. Você prefere que o acompanhamento seja diário ou semanal?";
        }

        if (profile.flow === "initial") return initialAssessmentReply(text, value, data, patient, profile);
        if (profile.flow === "custom") return customQuestionReply(text, value, data, patient, profile);
        if (profile.flow === "routine") return routineCheckinReply(text, value, data, patient, profile);
        if (profile.flow === "monthly") return monthlyCheckinReply(text, data, patient, profile);
        if (profile.flow === "weekly") return weeklyPlanReply(text, value, data, patient, profile);

        if (chatIncludes(value, ["atualização mensal", "atualizar meus dados", "fechamento mensal"])) {
          if (profile.consent !== true) return "Para registrar uma atualização mensal, precisamos primeiro confirmar o consentimento para armazenamento dos dados.";
          return startMonthlyCheckin(profile);
        }

        if (chatIncludes(value, ["fazer check-in", "começar check-in", "iniciar check-in", "como estamos indo"])) {
          if (profile.consent !== true) return "Para iniciar o check-in, precisamos primeiro confirmar o consentimento para armazenamento dos dados.";
          return startRoutineCheckin(profile);
        }

        if (chatIncludes(value, ["planejar minha semana", "planejamento semanal", "dica semanal", "dificuldade na semana"])) {
          if (profile.consent !== true) return "Posso oferecer uma dica geral, mas preciso do seu consentimento antes de registrar um plano de acompanhamento.";
          return startWeeklyPlan(profile);
        }

        const greetings = ["oi", "olá", "bom dia", "boa tarde", "boa noite"].map(normalizeChatText);
        if (greetings.includes(value) || value.startsWith("oi ") || value.startsWith(`${normalizeChatText("olá")} `)) {
          setConversationSituation(profile, "Conversa livre");
          return `Oi, ${firstName}. Estou aqui para acompanhar você com calma. Como você está se sentindo hoje?`;
        }

        if (chatIncludes(value, ["lipedema", "explique"])) {
          setConversationSituation(profile, "Educação sobre lipedema");
          return "O lipedema é uma condição crônica que pode envolver aumento desproporcional de tecido gorduroso, dor, sensibilidade e inchaço, principalmente nas pernas e, em algumas pessoas, nos braços. Cada experiência é individual. O acompanhamento ajuda a observar sintomas, hábitos e mudanças, mas o diagnóstico precisa ser feito por um médico.";
        }

        const painScore = chatScore(text);
        if (chatIncludes(value, ["dor", "inchaço", "edema"])) {
          setConversationSituation(profile, painScore !== null && painScore >= 7 ? "Dor elevada" : "Dor ou inchaço");
          if (painScore !== null && painScore >= 7) {
            return `Sinto muito que a dor esteja alta, ${firstName}. O corpo fala quando precisa de atenção. Conte onde dói, quando começou e se essa piora é diferente do habitual. Também vale entrar em contato com a equipe para uma avaliação individualizada.`;
          }
          return `Obrigada por contar, ${firstName}. Qual é a intensidade de 0 a 10, onde você sente mais e quando percebeu essa mudança? Vamos observar com carinho, sem tentar concluir um diagnóstico pelo chat.`;
        }

        if (chatIncludes(value, ["desmotivada", "desanimei", "não consigo", "sem resultado", "frustrada", "desisti", "cansada de tentar"])) {
          profile.engagement = Math.max(0, Number(profile.engagement || 7) - 2);
          setConversationSituation(profile, "Baixo engajamento");
          return `Faz sentido se sentir assim quando o resultado parece distante. O corpo leva tempo para construir confiança, e um período difícil não apaga o cuidado que você já teve. ${workspace.automation.lowEngagementAction}`;
        }

        if (chatIncludes(value, ["insônia", "não dormi", "dormi mal", "sono", "acordei de madrugada", "cansaço ao acordar"])) {
          setConversationSituation(profile, "Sono e ritmo biológico");
          return "Uma rotina de sono consistente pode apoiar o bem-estar e a percepção dos sintomas. Um passo possível é reduzir luz intensa e telas antes de dormir e manter horários mais regulares. Como foi a qualidade do seu sono, de 0 a 10?";
        }

        if (chatIncludes(value, ["ansiosa", "ansiedade", "estresse", "estressada", "sobrecarga", "nervosa"])) {
          setConversationSituation(profile, "Gestão do estresse");
          return "O estresse pode piorar sono, tensão e percepção da dor, mas isso não significa que suas emoções causem o lipedema. Faça uma pausa breve e experimente expirar mais lentamente do que inspira. O que está pesando mais para você hoje?";
        }

        if (chatIncludes(value, ["consegui", "estou melhor", "estou bem", "animada", "deu certo", "melhorei"])) {
          profile.engagement = Math.min(10, Number(profile.engagement || 7) + 1);
          setConversationSituation(profile, "Evolução positiva");
          return "Que bom perceber esse avanço. Valorize o que tornou isso possível, mesmo que pareça pequeno. O corpo responde à constância, não à pressa. O que você fez que gostaria de repetir?";
        }

        if (chatIncludes(value, ["consulta", "o que anotar", "como me preparar"])) {
          setConversationSituation(profile, "Preparação para consulta");
          return "Para a consulta, você pode reunir: intensidade e localização da dor, inchaço, mudanças nas medidas, sono, movimento, medicamentos em uso e as dúvidas que mais importam para você. Assim, a conversa fica mais clara e individualizada.";
        }

        if (chatIncludes(value, ["chá", "chás", "lipechá", "chá verde", "camomila", "dente-de-leão", "centella", "melissa"])) {
          setConversationSituation(profile, "Chás e práticas complementares");
          return "Chás podem fazer parte de um ritual de hidratação e autocuidado, mas não substituem tratamento e não devem ser usados com promessa de drenagem, desintoxicação ou cura. A escolha precisa ser confirmada com a equipe, especialmente se você usa medicamentos, tem alguma condição clínica, está grávida ou amamentando. Qual chá ou ingrediente você está pensando em usar?";
        }

        if (chatIncludes(value, ["alimentação", "comida", "fome"])) {
          setConversationSituation(profile, "Alimentação");
          return "A alimentação pode ser observada sem culpa e sem rigidez. O padrão do LipeCare prioriza alimentos in natura, vegetais variados, fibras, fontes adequadas de proteína e hidratação, reduzindo ultraprocessados, açúcar e álcool sem impor exclusões. Qual mudança parece mais possível na sua rotina agora?";
        }

        if (chatIncludes(value, ["exercício", "atividade física", "caminhada", "movimento", "fortalecimento", "musculação", "hidroginástica", "pilates"])) {
          setConversationSituation(profile, "Movimento");
          return "Movimento não precisa ser castigo. O protocolo valoriza fortalecimento orientado, atividades de baixo impacto e mobilidade já liberadas para você, com constância maior que intensidade. Qual tipo de movimento foi orientado pela equipe e parece mais possível na sua rotina?";
        }

        setConversationSituation(profile, "Conversa livre");
        return "Obrigada por compartilhar. Quero entender sem pressa: quando isso começou, o que mudou desde o último acompanhamento e o que parece melhorar ou piorar o que você está sentindo?\n\nCuidar é escutar o corpo, não controlá-lo.";
      }

      function recentAIHistory(messages) {
        return messages
          .slice(0, -1)
          .filter((message) => ["user", "assistant", "staff"].includes(message.role) && message.text)
          .slice(-16)
          .map((message) => ({
            role: message.role === "user" ? "user" : "assistant",
            text: String(message.text).slice(0, 3000)
          }));
      }

      async function createAssistantReply(text, patient, data, attachments, messages, suggestedReply) {
        const profile = chatProfile(data, patient);
        const workspace = workspaceConfig(data);
        if (!text || attachments.length || profile.consent !== true) {
          return { text: suggestedReply, ai: false, fallback: false };
        }

        const apiUrl = String(window.LIPECARE_API_URL || "http://localhost:4000").replace(/\/$/, "");
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 30000);

        try {
          const response = await fetch(`${apiUrl}/ai/chat`, {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json",
              "X-LipeCare-CSRF": activeSession?.csrfToken || ""
            },
            signal: controller.signal,
            body: JSON.stringify({
              message: text,
              suggestedReply,
              history: recentAIHistory(messages),
              context: {
                language: data.language,
                patientId: patient?.id || null,
                firstName: patient?.name?.split(" ")[0] || "Paciente",
                frequency: profile.frequency,
                stage: profile.stage,
                flow: profile.flow,
                step: profile.step,
                situation: profile.lastSituation,
                brandName: workspace.identity.brandName,
                professionalName: workspace.identity.professionalName,
                specialty: workspace.identity.specialty,
                assistantName: workspace.assistant.name,
                voiceStyle: workspace.assistant.voiceStyle,
                protocolName: workspace.protocol.name,
                protocolFoundation: workspace.protocol.foundation,
                protocolGuidance: workspace.protocol.guidance,
                protocolRestrictions: workspace.protocol.restrictions,
                pillars: workspace.protocol.pillars.map((pillar) => ({ name: pillar.name, description: pillar.description })),
                metrics: workspace.metrics.map((metric) => ({ name: metric.name, unit: metric.unit, direction: metric.direction, acceptable: metric.acceptable })),
                causeQuestions: workspace.causeQuestions.map((question) => ({ group: question.group, question: question.question, answerType: question.answerType, frequency: question.frequency })),
                automation: workspace.automation
              }
            })
          });
          if (!response.ok) throw new Error(`Resposta HTTP ${response.status}`);
          const payload = await response.json();
          if (!payload?.reply || payload.source !== "openai") throw new Error("Resposta inválida da IA.");
          return { text: String(payload.reply), ai: true, fallback: false, model: payload.model };
        } catch {
          return { text: suggestedReply, ai: false, fallback: true };
        } finally {
          clearTimeout(timeout);
        }
      }

      async function commitWorkspaceChange(workspace, user, action, resource) {
        try {
          const savedWorkspace = await persistWorkspace(workspace);
          const data = state();
          saveWorkspaceConfig(data, savedWorkspace);
          data.audit.unshift({ action, actor: user.name, resource, date: new Date().toLocaleString("pt-BR") });
          save(data);
          render();
        } catch (error) {
          alert(error.message);
          if (error.status === 409) await loadTenantWorkspace().catch(() => undefined);
          render();
        }
      }

      async function loadWorkspaceManagers() {
        const container = document.getElementById("workspace-managers");
        if (!container) return;
        try {
          tenantProfessionals = await apiRequest("/tenant/professionals");
          container.innerHTML = tenantProfessionals.length
            ? tenantProfessionals.map((professional) => `
                <label class="list-row">
                  <span><strong>${escapeHtml(professional.name)}</strong><small>${escapeHtml(professional.email)}</small></span>
                  <input type="checkbox" data-workspace-manager="${escapeHtml(professional.id)}" ${professional.canManageWorkspace ? "checked" : ""} ${professional.isActive ? "" : "disabled"} />
                </label>
              `).join("")
            : `<div class="empty">Nenhum profissional cadastrado.</div>`;
          container.querySelectorAll("[data-workspace-manager]").forEach((input) => {
            input.addEventListener("change", async () => {
              input.disabled = true;
              try {
                await apiRequest(`/tenant/workspace-managers/${encodeURIComponent(input.dataset.workspaceManager)}`, {
                  method: "PATCH",
                  body: { enabled: input.checked }
                });
              } catch (error) {
                input.checked = !input.checked;
                alert(error.message);
              } finally {
                input.disabled = false;
              }
            });
          });
        } catch (error) {
          container.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
        }
      }

        document.getElementById("chat-form")?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const formElement = event.currentTarget;
          if (activeAudioSession?.form === formElement) {
            alert("Finalize a gravação antes de enviar a mensagem.");
            return;
          }
          const form = new FormData(formElement);
          const text = String(form.get("message")).trim();
          const files = [...form.getAll("attachment"), formElement.recordedAudioFile].filter((file) => file && typeof file === "object" && Number(file.size) > 0);
          if (!text && !files.length) return;
          if (files.reduce((total, file) => total + Number(file.size), 0) > 2.5 * 1024 * 1024) {
            alert("Os anexos desta mensagem ultrapassam o limite total de 2,5 MB.");
            return;
          }
          let attachments;
          try {
            attachments = (await Promise.all(files.map(readAttachment))).filter(Boolean);
          } catch (error) {
            alert(error.message);
            return;
          }
          const data = state();
          const patient = selectedPatient(data, user);
          let replyRequest = null;
          if (user.role === "PATIENT") {
            if (!patient) return;
            data.chats ||= {};
            data.chats[patient.id] = patientMessages(data, patient);
            data.chats[patient.id].push({ role: "user", date: new Date().toLocaleString("pt-BR"), text, attachments });
            const control = chatControl(data, patient);
            if (control.aiEnabled && !control.assumedBy) {
              const suggestedReply = chatReply(text, patient, data, attachments);
              const profile = chatProfile(data, patient);
              if (text && !attachments.length && profile.consent === true) {
                replyRequest = { key: `patient:${patient.id}`, type: "patient", id: patient.id, patient, messages: data.chats[patient.id], suggestedReply };
              } else {
                data.chats[patient.id].push({ role: "assistant", date: new Date().toLocaleString("pt-BR"), text: suggestedReply });
              }
            }
            data.audit.unshift({ action: "patient_chat_message", actor: user.name, resource: patient.name, date: new Date().toLocaleString("pt-BR") });
          } else {
            if (data.chatMode === "patients") {
              if (!patient) return;
              const control = chatControl(data, patient);
              if (control.assumedBy !== user.id) return;
              data.chats ||= {};
              data.chats[patient.id] = patientMessages(data, patient);
              data.chats[patient.id].push({ role: "staff", author: user.name, date: new Date().toLocaleString("pt-BR"), text, attachments });
              data.audit.unshift({ action: "patient_chat_staff_message", actor: user.name, resource: patient.name, date: new Date().toLocaleString("pt-BR") });
            } else {
              data.staffChats ||= {};
              data.staffChats[user.id] = staffMessages(data, user);
              data.staffChats[user.id].push({ role: "user", date: new Date().toLocaleString("pt-BR"), text, attachments });
              const simulationPatient = staffSimulationPatient(user);
              const suggestedReply = chatReply(text, simulationPatient, data, attachments);
              const simulationProfile = chatProfile(data, simulationPatient);
              if (text && !attachments.length && simulationProfile.consent === true) {
                replyRequest = { key: `staff:${user.id}`, type: "staff", id: user.id, patient: simulationPatient, messages: data.staffChats[user.id], suggestedReply };
              } else {
                data.staffChats[user.id].push({ role: "assistant", date: new Date().toLocaleString("pt-BR"), text: suggestedReply });
              }
              data.audit.unshift({ action: "staff_patient_simulation_message", actor: user.name, resource: user.email, date: new Date().toLocaleString("pt-BR") });
            }
          }
          try {
            save(data);
          } catch (error) {
            alert("Não foi possível guardar os anexos neste dispositivo. Remova arquivos antigos ou envie anexos menores.");
            return;
          }

          if (!replyRequest) {
            render();
            return;
          }

          pendingChats.add(replyRequest.key);
          render();
          let reply;
          try {
            reply = await createAssistantReply(text, replyRequest.patient, data, attachments, replyRequest.messages, replyRequest.suggestedReply);
          } catch {
            reply = { text: replyRequest.suggestedReply, ai: false, fallback: true };
          }

          const latest = state();
          if (replyRequest.type === "patient") {
            latest.chats ||= {};
            latest.chats[replyRequest.id] ||= [];
            latest.chats[replyRequest.id].push({ role: "assistant", date: new Date().toLocaleString("pt-BR"), ...reply });
          } else {
            latest.staffChats ||= {};
            latest.staffChats[replyRequest.id] ||= [];
            latest.staffChats[replyRequest.id].push({ role: "assistant", date: new Date().toLocaleString("pt-BR"), ...reply });
          }
          pendingChats.delete(replyRequest.key);
          save(latest);
          render();
        });

            alert(error.message);
            return;
          }
          upsertPatientCredential(data, patient, email, password);
          data.modal = null;
          data.audit.unshift({ action: "patient_access_created", actor: user.name, resource: email, date: new Date().toLocaleString("pt-BR") });
          save(data);
          render();
        });

        const chatThread = document.querySelector(".chat-thread");
        if (chatThread) {
          chatThread.scrollTop = chatThread.scrollHeight;
        }
      }

      function render() {
        stopActiveAudioRecording(true);
        document.documentElement.dataset.theme = theme();
        if (!bootstrapComplete) {
          app.innerHTML = `<main class="loading-screen"><div><strong>LipeCare</strong><p>Preparando seu acesso...</p></div></main>`;
          return;
        }
        const route = routeInfo();
        if (route.type === "register" && !activeSession) {
          renderRegistration();
          return;
        }
        const user = session();
        if (!user) {
          renderLogin();
          return;
        }
        if (route.type === "clinic") syncRouteToState();
        renderShell(user);
      }

      async function bootstrapRoute() {
        let route = routeInfo();
        if (route.type === "root" || route.type === "unknown") {
          history.replaceState({}, "", activeSession ? clinicPath("home") : "/login");
          route = routeInfo();
        }
        if (route.type === "clinic") {
          const canonicalPath = clinicPath(route.view, route.slug);
          if (route.legacy || location.pathname !== canonicalPath) {
            history.replaceState({}, "", canonicalPath);
            route = routeInfo();
          }
        }
        if (activeSession && (route.type === "login" || route.type === "register")) {
          history.replaceState({}, "", clinicPath("home"));
          route = routeInfo();
        }
        if (route.type === "clinic") {
          if (!activeSession) {
            history.replaceState({}, "", `/login/${encodeURIComponent(route.slug)}`);
            return bootstrapRoute();
          }
          if (route.slug !== activeSession.tenant.slug) {
            history.replaceState({}, "", clinicPath("home"));
          }
          syncRouteToState();
        }
        route = routeInfo();
        if (route.type === "login" && route.slug) {
          try {
            activePublicBrand = await bootstrapRequest(`/tenants/${encodeURIComponent(route.slug)}/public`);
            bootstrapError = "";
          } catch (error) {
            activePublicBrand = null;
            if (error.status === 404) {
              history.replaceState({}, "", "/login");
              bootstrapError = "";
            } else {
              bootstrapError = error.message;
            }
          }
        } else if (route.type !== "clinic") {
          activePublicBrand = null;
        }
        render();
        syncBootstrapReconnect();
      }

      async function bootstrap() {
        window.clearTimeout(bootstrapRetryTimer);
        bootstrapRetryTimer = null;
        bootstrapError = "";
        bootstrapComplete = false;
        render();
        try {
          const payload = await bootstrapRequest("/auth/me");
          setSession(payload);
          await loadTenantWorkspace();
          await loadClinicalState();
        } catch (error) {
          activeSession = null;
          if (error.status !== 401) bootstrapError = error.message;
        }
        bootstrapComplete = true;
        await bootstrapRoute();
      }

      window.addEventListener("popstate", bootstrapRoute);
      bootstrap();
    </script>
  </body>
</html>
