server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location /api/ {
    # Resolve through Docker DNS at request time so the frontend can start
    # independently while the API service is being replaced during a deploy.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $lipecare_api srv-captain--lipecare-api:4000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$lipecare_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
