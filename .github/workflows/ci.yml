name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build shared package
        run: npm run build -w @lipecare/shared

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t lipecare-ci .

      - name: Build preview container
        run: docker build -f preview/Dockerfile -t lipecare-preview-ci .

      - name: Validate preview routes
        run: |
          docker run --detach --name lipecare-preview-ci --publish 8080:80 lipecare-preview-ci
          trap 'docker rm --force lipecare-preview-ci' EXIT

          for route in / /login /cadastro /clinica-teste/configuracoes; do
            curl --fail --silent --show-error \
              --retry 10 \
              --retry-connrefused \
              --retry-delay 1 \
              "http://127.0.0.1:8080${route}" \
              --output /dev/null
          done
